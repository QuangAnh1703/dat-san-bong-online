openapi: 3.0.3

info:
  title: API Nen tang dat san bong da truc tuyen
  version: 1.0.0
  description: |
    Dac ta nhom endpoint loi cua he thong dat san bong da.

    ## Dinh dang phan hoi loi
    Moi loi deu tra ve cung mot cau truc, sinh tai mot cho duy nhat
    (`backend/src/middlewares/errorHandler`):

    ```json
    {
      "error": {
        "code": "SLOT_TAKEN",
        "message": "Khung gio nay da co nguoi dat",
        "details": { "field_id": 3 },
        "requestId": "3f7c...",
        "timestamp": "2026-09-14T12:30:00.000Z"
      }
    }
    ```

    - `code` la ma **on dinh**, client xu ly theo ma nay chu khong theo `message`.
    - `message` la cau tieng Viet de hien thang cho nguoi dung.
    - `requestId` cung xuat hien o header `X-Request-Id`, dung de doi chieu log server.

    Bang ma loi day du xem tai `backend/src/lib/errors.js`.

servers:
  - url: http://localhost:3000
    description: May phat trien

tags:
  - name: He thong
  - name: Xac thuc
  - name: Cum san
  - name: San con
  - name: Bang gia
  - name: Dat san
  - name: Quan tri - Duyet san
  - name: Quan tri - Duyet Chu san
  - name: Quan tri - Quan ly Nguoi dung

paths:
  /health:
    get:
      tags: [He thong]
      summary: Kiem tra ket noi co so du lieu
      responses:
        '200':
          description: Ket noi binh thuong
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:      { type: string, example: ok }
                  db:          { type: string, example: sanbong }
                  user:        { type: string, example: sanbong }
                  tables:      { type: integer, example: 21 }
                  server_time: { type: string, format: date-time }
        '503':
          $ref: '#/components/responses/DbUnavailable'

  /api/districts:
    get:
      tags: [He thong]
      summary: Danh sach quan/huyen
      responses:
        '200':
          description: Danh sach quan/huyen
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 6 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/District' }

  /api/auth/register:
    post:
      tags: [Xac thuc]
      summary: Dang ky tai khoan bang so dien thoai
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Tao tai khoan thanh cong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Thieu truong bat buoc, SDT sai dinh dang (`INVALID_PHONE`) hoac mat khau qua ngan (`WEAK_PASSWORD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: SDT da duoc dang ky (`PHONE_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      tags: [Xac thuc]
      summary: Dang nhap bang email hoac so dien thoai
      description: |
        Ho tro dang nhap bang email hoac so dien thoai va mat khau.
        - Neu gui `email`: phai la email hop le
        - Neu gui `phone_number`: phai la 10 chu so, bat dau bang 0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Dang nhap thanh cong, nhan JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Thieu email/phone_number hoac password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Email/SDT hoac mat khau sai (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/request-otp:
    post:
      tags: [Xac thuc]
      summary: Yeu cau ma OTP de dang ky
      description: Gui OTP ve SMS (demo hien thi trong log). Con lai 15 phut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '0912345678' }
      responses:
        '200':
          description: OTP gui thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'OTP sent' }
                  phone:   { type: string, example: '5678', description: '4 chu so cuoi cua SDT' }
        '400':
          description: SDT sai dinh dang hoac khong hop le
        '409':
          description: SDT da duoc dang ky (`PHONE_TAKEN`)
        '429':
          description: Nhap sai qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/verify-otp:
    post:
      tags: [Xac thuc]
      summary: Xac minh ma OTP
      description: Neu dung, tra ve temp_token (hieu luc 10 phut) dung de dang ky.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string, example: '0912345678' }
                otp:   { type: string, example: '123456', maxLength: 6 }
      responses:
        '200':
          description: OTP dung, nhan temp_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp_token: { type: string, description: 'Dung de /register-with-otp' }
        '400':
          description: OTP khong dung, het han, hoac temp token khong hop le
        '429':
          description: Nhap sai qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/register-with-otp:
    post:
      tags: [Xac thuc]
      summary: Dang ky sau khi xac minh OTP
      description: |
        Tao tai khoan sau khi OTP duoc xac minh.
        - Neu `role` la `OWNER`, tai khoan se duoc tao voi vai tro OWNER ngay lap tuc.
        - Neu `role` la `PLAYER` (mac dinh), user la PLAYER binh thuong va co the nang cap OWNER sau.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, password, full_name]
              properties:
                temp_token:     { type: string, description: 'Tu /verify-otp' }
                password:       { type: string, minLength: 6, example: 'password123' }
                full_name:      { type: string, example: 'Nguyen Van A' }
                district_code:  { type: string, example: 'CG', nullable: true }
                role:           { type: string, enum: [PLAYER, OWNER], default: PLAYER, description: 'Mac dinh PLAYER. Chi PLAYER co the dang ky OWNER va phai duyet' }
      responses:
        '201':
          description: Tao tai khoan thanh cong, nhan JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Thieu truong, mat khau ngan, hoac temp token het han, hoac role khong hop le

  /api/auth/forgot-password:
    post:
      tags: [Xac thuc]
      summary: Yeu cau OTP de dat lai mat khau
      description: Gui OTP ve email. Con lai 15 phut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: 'user@example.com' }
      responses:
        '200':
          description: OTP gui thanh cong (khong tim thay email cung tra ve message nay de bao mat)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'OTP sent to email if account exists' }
                  email:   { type: string, example: '*@example.com', description: 'Email da an dau co diem' }
        '400':
          description: Email sai dinh dang (`INVALID_EMAIL`)
        '429':
          description: Yeu cau qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/verify-reset-otp:
    post:
      tags: [Xac thuc]
      summary: Xac minh OTP de dat lai mat khau
      description: Neu dung, tra ve temp_token (hieu luc 10 phut) dung de reset-password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email, example: 'user@example.com' }
                otp:   { type: string, example: '123456', maxLength: 6 }
      responses:
        '200':
          description: OTP dung, nhan temp_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp_token: { type: string, description: 'Dung de /reset-password' }
        '400':
          description: OTP khong dung, het han, hoac temp token khong hop le
        '429':
          description: Nhap sai qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/reset-password:
    post:
      tags: [Xac thuc]
      summary: Dat lai mat khau sau khi xac minh OTP
      description: Dat lai mat khau sau khi OTP duoc xac minh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, password]
              properties:
                temp_token: { type: string, description: 'Tu /verify-reset-otp' }
                password:   { type: string, minLength: 6, example: 'newpassword123' }
      responses:
        '200':
          description: Dat lai mat khau thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Password reset successfully' }
        '400':
          description: Mat khau qua ngan hoac temp token khong hop le / het han (`OTP_EXPIRED`)

  /api/venues:
    get:
      tags: [Cum san]
      summary: Tim cum san da duoc duyet
      parameters:
        - name: district
          in: query
          description: Ma quan/huyen, vi du `CG`
          schema: { type: string }
        - name: q
          in: query
          description: Tu khoa tim trong ten hoac dia chi
          schema: { type: string }
      responses:
        '200':
          description: Danh sach cum san, sap xep theo diem danh gia giam dan
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VenueSummary' }

  /api/venues/{id}:
    get:
      tags: [Cum san]
      summary: Chi tiet cum san kem san con, tien ich va bang gia
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Chi tiet cum san
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/venues/{id}/revenue:
    get:
      tags: [Cum san]
      summary: Doanh thu theo ngay (60 ngay gan nhat)
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Doanh thu theo ngay
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        venue_id:      { type: integer }
                        play_date:     { type: string, format: date }
                        booking_count: { type: integer }
                        revenue:       { type: integer }

  /api/fields/{id}/schedule:
    get:
      tags: [San con]
      summary: So do lich cua mot san con trong ngay
      description: Nguon du lieu cho man hinh WF-03 (so do lich real-time).
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - name: date
          in: query
          description: Ngay can xem, mac dinh hom nay
          schema: { type: string, format: date, example: '2026-09-20' }
      responses:
        '200':
          description: Danh sach khung gio trong ngay
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_id:  { type: integer }
                  play_date: { type: string, format: date }
                  count:     { type: integer }
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }

  /api/fields/{id}/availability:
    get:
      tags: [San con]
      summary: Kiem tra mot khung gio con trong khong
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: start
          in: query
          required: true
          schema: { type: string, example: '19:30' }
        - name: end
          in: query
          required: true
          schema: { type: string, example: '21:00' }
      responses:
        '200':
          description: Ket qua kiem tra
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_id:  { type: integer }
                  date:      { type: string, format: date }
                  start:     { type: string }
                  end:       { type: string }
                  available: { type: boolean }
        '400':
          description: Thieu tham so bat buoc (`MISSING_FIELD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/pricing/{venueId}:
    get:
      tags: [Bang gia]
      summary: Danh sach tat ca bang gia theo khung gio (SCRUM-121)
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Danh sach bang gia
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PricingRule' }

    post:
      tags: [Bang gia]
      summary: Tao bang gia moi (SCRUM-121)
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePricingRuleRequest' }
      responses:
        '201':
          description: Tao bang gia thanh cong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400':
          description: Thieu truong bat buoc hoac khung gio khong hop le
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Khung gio bi chong lap (SCRUM-122, code: `PRICE_SLOT_OVERLAP`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/pricing/{venueId}/{id}:
    get:
      tags: [Bang gia]
      summary: Chi tiet mot bang gia
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Chi tiet bang gia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Bang gia]
      summary: Cap nhat bang gia
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePricingRuleRequest' }
      responses:
        '200':
          description: Cap nhat thanh cong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400':
          description: Du lieu khong hop le
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Khung gio bi chong lap (SCRUM-122)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [Bang gia]
      summary: Xoa bang gia
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Xoa thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookings:
    post:
      tags: [Dat san]
      summary: Tao don dat san va giu khung gio
      description: |
        Don duoc tao o trang thai `HELD` kem `hold_expires_at`.
        Rang buoc `EXCLUDE` o tang CSDL dam bao hai nguoi dat cung khung gio
        thi nguoi sau nhan loi `SLOT_TAKEN` - chong dat trung ngay ca khi chay song song.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Tao don thanh cong, khung gio da duoc giu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Thieu truong bat buoc hoac vi pham rang buoc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                MISSING_FIELD:
                  value:
                    error:
                      code: MISSING_FIELD
                      message: 'Thieu truong bat buoc: user_id'
                      details: { missing: [user_id] }
                      requestId: 3f7c9b12-1f0a-4c2e-9f11-2b7d4e8a91c3
                      timestamp: '2026-09-14T12:30:00.000Z'
        '404':
          description: San khong ton tai (`FIELD_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Xung dot nghiep vu:
            `SLOT_TAKEN` khung gio da co nguoi dat,
            `NO_PRICE_RULE` chua co bang gia,
            `VENUE_NOT_APPROVED` cum san chua duoc duyet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                SLOT_TAKEN:
                  value:
                    error:
                      code: SLOT_TAKEN
                      message: Khung gio nay da co nguoi dat
                      requestId: 8a2f1c04-77bd-4f3a-8c19-51e0b7f2a6dd
                      timestamp: '2026-09-14T12:30:00.000Z'

  /api/bookings/{code}:
    get:
      tags: [Dat san]
      summary: Tra cuu don theo ma
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: BK260914A7K2M }
      responses:
        '200':
          description: Chi tiet don kem khung gio va giao dich thanh toan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookings/{code}/cancel:
    post:
      tags: [Dat san]
      summary: Huy don va tra lai khung gio
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: Ban dot xuat }
      responses:
        '200':
          description: Da huy
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:            { type: string }
                  status:          { type: string, example: CANCELLED_BY_USER }
                  released_slots:  { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Don o trang thai khong cho huy (`INVALID_STATUS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/bookings/maintenance/release-expired:
    post:
      tags: [Dat san]
      summary: Don cac don giu cho da qua han
      description: Goi ham `fn_release_expired_holds()` trong CSDL. Dung cho cron hoac thao tac thu cong.
      responses:
        '200':
          description: So don da duoc giai phong
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: integer, example: 3 }

  /api/admin/venues/pending:
    get:
      tags: [Quan tri - Duyet san]
      summary: Danh sach cum san cho duyet (SCRUM-119)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Danh sach cum san PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        owner_id: { type: integer }
                        name: { type: string }
                        address: { type: string }
                        district_code: { type: string }
                        district_name: { type: string }
                        phone: { type: string }
                        field_count: { type: integer }
                        created_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/venues/{id}/approval-history:
    get:
      tags: [Quan tri - Duyet san]
      summary: Lich su duyet cua mot cum san (SCRUM-119)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Lich su duyet
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        action: { type: string, enum: [SUBMIT, APPROVE, REJECT, SUSPEND] }
                        reason: { type: string, nullable: true }
                        created_at: { type: string, format: date-time }
                        admin_name: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/venues/{id}/approve:
    post:
      tags: [Quan tri - Duyet san]
      summary: Phe duyet cum san (SCRUM-119 + SCRUM-120)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Cum san da duoc phe duyet
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      venue_id: { type: integer }
                      status: { type: string, example: APPROVED }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Cum san khong la PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/venues/{id}/reject:
    post:
      tags: [Quan tri - Duyet san]
      summary: Tu choi cum san va gui thong bao (SCRUM-119 + SCRUM-120)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500, example: "Anh theo quy dinh..." }
      responses:
        '200':
          description: Cum san da bi tu choi, thong bao da gui toi chu san
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      venue_id: { type: integer }
                      status: { type: string, example: REJECTED }
                      reason: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Thieu reason hoac cum san khong la PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/venues/{id}/resubmit:
    post:
      tags: [Quan tri - Duyet san]
      summary: Cho phep chu san tai gui ho so sau khi bi tu choi (SCRUM-119)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Cum san da duoc tai gui, quay ve trang thai PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      venue_id: { type: integer }
                      status: { type: string, example: PENDING }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Cum san khong o trang thai REJECTED hoac DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== Owner & User Management =====

  /api/owner/request:
    post:
      tags: [Xac thuc]
      summary: Yeu cau nang cap tu PLAYER sang OWNER
      description: Cho phep nguoi choi yeu cau tro thanh chu san. Yeu cau phai duoc Admin duyet.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Yeu cau nang cap da gui thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  request:
                    type: object
                    properties:
                      id: { type: integer }
                      user_id: { type: integer }
                      status: { type: string, example: PENDING }
                      requested_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: User khong phai PLAYER hoac da co yeu cau dang doi duyet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/owner/me:
    get:
      tags: [Xac thuc]
      summary: Xem trang thai yeu cau OWNER cua user hien tai
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Trang thai yeu cau (null neu khong co)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                      requested_at: { type: string, format: date-time }
                      reviewed_at: { type: string, format: date-time, nullable: true }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/owner-requests:
    get:
      tags: [Quan tri - Duyet Chu san]
      summary: Danh sach yeu cau nang cap OWNER (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Danh sach yeu cau cho duyet
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        user_id: { type: integer }
                        status: { type: string, example: PENDING }
                        requested_at: { type: string, format: date-time }
                        email: { type: string }
                        phone: { type: string, nullable: true }
                        full_name: { type: string }
                        district_code: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/owner-requests/{id}/approve:
    post:
      tags: [Quan tri - Duyet Chu san]
      summary: Phe duyet yeu cau nang cap OWNER
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Yeu cau da duoc phe duyet, user da tro thanh OWNER
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  request:
                    type: object
                    properties:
                      id: { type: integer }
                      user_id: { type: integer }
                      status: { type: string, example: APPROVED }
                      reviewed_at: { type: string, format: date-time }
                      reviewed_by: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Yeu cau khong o trang thai PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/owner-requests/{id}/reject:
    post:
      tags: [Quan tri - Duyet Chu san]
      summary: Tu choi yeu cau nang cap OWNER
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500, example: 'Tai khoan chua du dieu kien' }
      responses:
        '200':
          description: Yeu cau da bi tu choi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  request:
                    type: object
                    properties:
                      id: { type: integer }
                      user_id: { type: integer }
                      status: { type: string, example: REJECTED }
                      rejection_reason: { type: string }
                      reviewed_at: { type: string, format: date-time }
                      reviewed_by: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users:
    get:
      tags: [Quan tri - Quan ly Nguoi dung]
      summary: Danh sach tat ca nguoi dung (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: role
          in: query
          schema: { type: string, enum: [PLAYER, OWNER, ADMIN] }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
      responses:
        '200':
          description: Danh sach nguoi dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        email: { type: string }
                        phone: { type: string, nullable: true }
                        role: { type: string, enum: [PLAYER, OWNER, ADMIN] }
                        status: { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
                        created_at: { type: string, format: date-time }
                        full_name: { type: string }
                        district_code: { type: string, nullable: true }
                        reputation_score: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{id}/role:
    put:
      tags: [Quan tri - Quan ly Nguoi dung]
      summary: Thay doi vai tro cua nguoi dung (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [PLAYER, OWNER, ADMIN] }
      responses:
        '200':
          description: Vai tro da duoc cap nhat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string }
                      role: { type: string, enum: [PLAYER, OWNER, ADMIN] }
                      status: { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    VenueId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    FieldId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    NotFound:
      description: Khong tim thay du lieu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DbUnavailable:
      description: Khong ket noi duoc co so du lieu (`DB_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, timestamp]
          properties:
            code:
              type: string
              description: Ma loi on dinh, client xu ly theo ma nay
              enum:
                - VALIDATION_ERROR
                - MISSING_FIELD
                - INVALID_TIME_RANGE
                - CONSTRAINT_VIOLATED
                - INVALID_PHONE
                - WEAK_PASSWORD
                - UNAUTHENTICATED
                - FORBIDDEN
                - INVALID_CREDENTIALS
                - NOT_FOUND
                - VENUE_NOT_FOUND
                - FIELD_NOT_FOUND
                - BOOKING_NOT_FOUND
                - ROUTE_NOT_FOUND
                - SLOT_TAKEN
                - PHONE_TAKEN
                - VENUE_NOT_APPROVED
                - NO_PRICE_RULE
                - INVALID_STATUS
                - HOLD_EXPIRED
                - PRICE_SLOT_OVERLAP
                - DB_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_IMPLEMENTED
            message:   { type: string, description: Cau thong bao tieng Viet cho nguoi dung }
            details:   { type: object, description: Thong tin phu de debug hoac to mau o truong sai }
            requestId: { type: string, description: Trung voi header X-Request-Id }
            timestamp: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [phone, password, full_name]
      properties:
        phone:         { type: string, example: '0912345678', description: '10 so, bat dau bang 0' }
        password:      { type: string, format: password, example: matkhau123, description: Toi thieu 6 ky tu }
        full_name:     { type: string, example: Nguyen Van A }
        district_code: { type: string, example: CG }

    LoginRequest:
      type: object
      required: [password]
      properties:
        email:         { type: string, example: 'user@example.com', nullable: true, description: 'Email hoac phone_number, mot trong hai la bat buoc' }
        phone_number:  { type: string, example: '0912345678', nullable: true, description: '10 chu so, bat dau bang 0' }
        password:      { type: string, format: password, example: 'password123' }

    User:
      type: object
      properties:
        id:             { type: integer }
        phone:          { type: string, example: '0912345678' }
        role:           { type: string, enum: [PLAYER, OWNER, ADMIN] }
        status:         { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
        phone_verified: { type: boolean }
        full_name:      { type: string }
        district_code:  { type: string }
        skill_level:    { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }

    AuthResponse:
      type: object
      properties:
        access_token:  { type: string, description: JWT, het han theo JWT_ACCESS_EXPIRES }
        refresh_token: { type: string, description: JWT, het han theo JWT_REFRESH_EXPIRES }
        user:          { $ref: '#/components/schemas/User' }

    District:
      type: object
      properties:
        code: { type: string, example: CG }
        name: { type: string, example: Cau Giay }

    VenueSummary:
      type: object
      properties:
        id:            { type: integer }
        name:          { type: string, example: San Cau Giay Center }
        address:       { type: string }
        district_code: { type: string }
        district_name: { type: string }
        phone:         { type: string }
        avg_rating:    { type: number, format: float, example: 4.6 }
        rating_count:  { type: integer, example: 128 }
        open_time:     { type: string, example: '05:00:00' }
        close_time:    { type: string, example: '23:00:00' }
        deposit_rate:  { type: number, format: float, example: 0.3 }
        field_count:   { type: integer, example: 6 }
        min_price:     { type: integer, description: Gia thap nhat moi gio, dong, example: 250000 }
        amenities:
          type: array
          items: { type: string }
          example: [Den, Cang tin]

    PricingRule:
      type: object
      properties:
        id:            { type: integer }
        venue_id:      { type: integer }
        field_type:    { type: string, example: '5-a-side' }
        day_type:      { type: string, enum: [WEEKDAY, WEEKEND, HOLIDAY] }
        from_minute:   { type: integer, description: 'Phut tinh tu 00:00, VD: 540 = 09:00' }
        to_minute:     { type: integer }
        from_time:     { type: string, example: '09:00', description: 'Chuoi thoi gian (format HH:MM)' }
        to_time:       { type: string, example: '10:00' }
        base_price:    { type: number, example: 250000, description: 'Gia co so (VND/gio)' }
        multiplier:    { type: number, example: 1.2, description: 'He so nhan (0.1-5)' }
        label:         { type: string, example: 'Gio vang', nullable: true }
        created_at:    { type: string, format: date-time }

    CreatePricingRuleRequest:
      type: object
      required: [field_type, day_type, from_time, to_time, base_price]
      properties:
        field_type:  { type: string, example: '5-a-side' }
        day_type:    { type: string, enum: [WEEKDAY, WEEKEND, HOLIDAY] }
        from_time:   { type: string, example: '09:00' }
        to_time:     { type: string, example: '10:00' }
        base_price:  { type: number, example: 250000 }
        multiplier:  { type: number, example: 1.0 }
        label:       { type: string, nullable: true }

    UpdatePricingRuleRequest:
      type: object
      properties:
        field_type:  { type: string }
        day_type:    { type: string }
        from_time:   { type: string }
        to_time:     { type: string }
        base_price:  { type: number }
        multiplier:  { type: number }
        label:       { type: string, nullable: true }

    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/VenueSummary'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  id:        { type: integer }
                  name:      { type: string, example: San 7 so 1 }
                  type:      { type: string, enum: [F5, F7, F11] }
                  is_active: { type: boolean }
            price_rules:
              type: array
              items:
                type: object
                properties:
                  field_type:     { type: string }
                  day_type:       { type: string, enum: [WEEKDAY, WEEKEND] }
                  from_minute:    { type: integer, description: Phut tinh tu 00:00, example: 1170 }
                  to_minute:      { type: integer, example: 1290 }
                  base_price:     { type: integer }
                  multiplier:     { type: number }
                  label:          { type: string, example: Gio vang }
                  price_per_hour: { type: integer }

    Slot:
      type: object
      properties:
        field_id:  { type: integer }
        play_date: { type: string, format: date }
        start_at:  { type: string, format: date-time }
        end_at:    { type: string, format: date-time }
        status:
          type: string
          enum: [AVAILABLE, HELD, BOOKED, BLOCKED]
        price:     { type: integer }

    CreateBookingRequest:
      type: object
      required: [field_id, play_date, start, end, user_id]
      properties:
        field_id:    { type: integer, example: 3 }
        play_date:   { type: string, format: date, example: '2026-09-20' }
        start:       { type: string, example: '19:30' }
        end:         { type: string, example: '21:00' }
        user_id:     { type: integer, description: Nguoi dat, bat buoc theo rang buoc ck_booking_owner }
        guest_name:  { type: string, description: Thong tin lien he them, khong thay the user_id }
        guest_phone: { type: string, example: '0912345678' }
        note:        { type: string }

    Booking:
      type: object
      properties:
        id:              { type: integer }
        code:            { type: string, example: BK260914A7K2M }
        kind:            { type: string, enum: [SINGLE, RECURRING] }
        status:
          type: string
          enum: [HELD, PENDING_VERIFY, CONFIRMED, COMPLETED, CANCELLED_BY_USER, CANCELLED_BY_OWNER, EXPIRED]
        venue_id:        { type: integer }
        user_id:         { type: integer }
        total_amount:    { type: integer, example: 375000 }
        deposit_amount:  { type: integer, example: 112500 }
        hold_expires_at: { type: string, format: date-time }
        hours:           { type: number, example: 1.5 }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            venue_name: { type: string }
            payments:
              type: array
              items:
                type: object
                properties:
                  id:           { type: integer }
                  method:       { type: string, enum: [VNPAY, TRANSFER, CASH, MOMO] }
                  status:       { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
                  amount:       { type: integer }
                  provider_ref: { type: string }
                  paid_at:      { type: string, format: date-time }
