        '200':
          description: Bai dang da cap nhat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/MatchPost' }

  /api/community/requests:
    post:
      tags: [Cong dong - Ghep doi]
      summary: Gui yeu cau tham gia bai dang
      description: |
        Cap keo doi-doi (`TEAM_FINDS_TEAM`): bat buoc co doi (`TEAM_REQUIRED`), moi tran chi gui mot lan
        (`REQUEST_ALREADY_EXISTS`), doi khach da co lich da khac trung khung gio -> `SCHEDULE_CONFLICT`.
        Doi chu nha nhan thong bao `MATCH_REQUEST`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id]
              properties:
                post_id:  { type: integer }
                message:  { type: string, description: Loi nhan gui cho tac gia bai }
      responses:
        '201':
          description: Yeu cau da gui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/JoinRequest' }
    get:
      tags: [Cong dong - Ghep doi]
      summary: Danh sach yeu cau cua toi hoac tren bai dang
      security:
        - BearerAuth: []
      parameters:
        - name: post_id
          in: query
          schema: { type: integer }
          description: Chi xem yeu cau tren mot bai dang (chi tac gia bai dang)
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED]
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Danh sach yeu cau
