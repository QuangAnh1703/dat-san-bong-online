                  result:
                    type: object
                    properties:
                      venue_id: { type: integer }
                      status: { type: string, example: APPROVED }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Cum san khong la PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/venues/{id}/reject:
    post:
      tags: [Quan tri - Duyet san]
      summary: Tu choi cum san va gui thong bao (SCRUM-119 + SCRUM-120)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500, example: "Anh theo quy dinh..." }
      responses:
        '200':
          description: Cum san da bi tu choi, thong bao da gui toi chu san
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      venue_id: { type: integer }
                      status: { type: string, example: REJECTED }
                      reason: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Thieu reason hoac cum san khong la PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/venues/{id}/resubmit:
    post:
      tags: [Quan tri - Duyet san]
      summary: Cho phep chu san tai gui ho so sau khi bi tu choi (SCRUM-119)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Cum san da duoc tai gui, quay ve trang thai PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  result:
                    type: object
                    properties:
                      venue_id: { type: integer }
                      status: { type: string, example: PENDING }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Cum san khong o trang thai REJECTED hoac DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== Owner & User Management =====

  /api/owner/request:
    post:
      tags: [Xac thuc]
      summary: Yeu cau nang cap tu PLAYER sang OWNER
      description: Cho phep nguoi choi yeu cau tro thanh chu san. Yeu cau phai duoc Admin duyet.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Yeu cau nang cap da gui thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  request:
                    type: object
                    properties:
                      id: { type: integer }
                      user_id: { type: integer }
                      status: { type: string, example: PENDING }
                      requested_at: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: User khong phai PLAYER hoac da co yeu cau dang doi duyet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/owner/me:
    get:
      tags: [Xac thuc]
      summary: Xem trang thai yeu cau OWNER cua user hien tai
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Trang thai yeu cau (null neu khong co)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
                      requested_at: { type: string, format: date-time }
                      reviewed_at: { type: string, format: date-time, nullable: true }
                  message: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/owner-requests:
    get:
      tags: [Quan tri - Duyet Chu san]
      summary: Danh sach yeu cau nang cap OWNER (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Danh sach yeu cau cho duyet
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        user_id: { type: integer }
                        status: { type: string, example: PENDING }
                        requested_at: { type: string, format: date-time }
                        email: { type: string }
                        phone: { type: string, nullable: true }
                        full_name: { type: string }
                        district_code: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/owner-requests/{id}/approve:
    post:
      tags: [Quan tri - Duyet Chu san]
      summary: Phe duyet yeu cau nang cap OWNER
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Yeu cau da duoc phe duyet, user da tro thanh OWNER
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  request:
                    type: object
                    properties:
                      id: { type: integer }
                      user_id: { type: integer }
                      status: { type: string, example: APPROVED }
                      reviewed_at: { type: string, format: date-time }
                      reviewed_by: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: Yeu cau khong o trang thai PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/admin/owner-requests/{id}/reject:
    post:
      tags: [Quan tri - Duyet Chu san]
      summary: Tu choi yeu cau nang cap OWNER
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500, example: 'Tai khoan chua du dieu kien' }
      responses:
        '200':
          description: Yeu cau da bi tu choi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  request:
                    type: object
                    properties:
                      id: { type: integer }
                      user_id: { type: integer }
                      status: { type: string, example: REJECTED }
                      rejection_reason: { type: string }
                      reviewed_at: { type: string, format: date-time }
                      reviewed_by: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users:
    get:
      tags: [Quan tri - Quan ly Nguoi dung]
      summary: Danh sach tat ca nguoi dung (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: role
          in: query
          schema: { type: string, enum: [PLAYER, OWNER, ADMIN] }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
      responses:
        '200':
          description: Danh sach nguoi dung
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        email: { type: string }
                        phone: { type: string, nullable: true }
                        role: { type: string, enum: [PLAYER, OWNER, ADMIN] }
                        status: { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
                        created_at: { type: string, format: date-time }
                        full_name: { type: string }
                        district_code: { type: string, nullable: true }
                        reputation_score: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{id}/role:
    put:
      tags: [Quan tri - Quan ly Nguoi dung]
      summary: Thay doi vai tro cua nguoi dung (ADMIN only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [PLAYER, OWNER, ADMIN] }
      responses:
        '200':
          description: Vai tro da duoc cap nhat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      email: { type: string }
                      role: { type: string, enum: [PLAYER, OWNER, ADMIN] }
                      status: { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/refresh:
    post:
      tags: [Xac thuc]
      summary: Doi refresh token lay access token moi
      description: Access token song 15 phut, refresh token 7 ngay. Tai khoan bi khoa nhan `ACCOUNT_LOCKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Cap token moi
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        '401':
          description: '`TOKEN_EXPIRED` / `INVALID_TOKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`ACCOUNT_LOCKED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/bookings/recurring:
    post:
      tags: [Dat san]
      summary: Dat san dinh ky theo tuan (hop dong giu san)
      description: |
        Tao mot don `RECURRING` gom moi buoi trong `months` thang roi vao `weekdays`, o trang thai `HELD`.
        Chiet khau lay tu khuyen mai `CONTRACT_DISCOUNT` cua san, mac dinh 10% (1-2 thang) / 15% (>= 3 thang).
        Neu co buoi da bi dat, tra `RECURRING_CONFLICT` kem danh sach ngay trong `details.dates`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_id, weekdays, start_date, months, start, end]
              properties:
                field_id:   { type: integer, example: 1 }
                weekdays:   { type: array, items: { type: integer, minimum: 1, maximum: 7 }, example: [2, 5], description: 'ISO: 1 = Thu 2, 7 = Chu nhat' }
                start_date: { type: string, format: date }
                months:     { type: integer, minimum: 1, maximum: 6 }
                start:      { type: string, example: '19:00' }
                end:        { type: string, example: '20:30' }
                note:       { type: string }
      responses:
        '201':
          description: Tao hop dong thanh cong
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Booking'
                  - type: object
                    properties:
                      sessions_total:    { type: integer }
                      contract_discount: { type: integer, description: Phan tram chiet khau }
        '409':
          description: '`RECURRING_CONFLICT` / `NO_PRICE_RULE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/payments:
    post:
      tags: [Thanh toan]
      summary: Bao da chuyen khoan tien coc
      description: |
        Chi ho tro chuyen khoan ngan hang (cong VNPay/MoMo chua tich hop). Don `HELD` chuyen sang
        `PENDING_VERIFY` (khong con bi tu huy) va cho chu san xac nhan. Tra ve thong tin chuyen khoan
        de client hien ma VietQR.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code]
              properties:
                booking_code:   { type: string }
                bill_image_url: { type: string, description: Anh bien lai (tuy chon) }
      responses:
        '201':
          description: Da ghi nhan thanh toan cho duyet
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_code: { type: string }
                  status: { type: string, example: PENDING_VERIFY }
                  payment: { type: object }
                  transfer:
                    type: object
                    properties:
                      bank_name:    { type: string }
                      bank_account: { type: string }
                      bank_holder:  { type: string }
                      amount:       { type: integer }
                      content:      { type: string, example: SANBONG BK260930ABCDE }
        '409':
          description: '`INVALID_STATUS` - don khong o trang thai HELD'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/teams/me:
    get:
      tags: [Doi bong]
      summary: Doi ma nguoi dung dang lam doi truong
      security:
        - BearerAuth: []
      responses:
        '200':
          description: '`team` = null neu chua co doi'
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: '#/components/schemas/Team' }
    put:
      tags: [Doi bong]
      summary: Tao hoac cap nhat doi bong cua minh
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:          { type: string, maxLength: 120 }
                member_count:  { type: integer, minimum: 1, maximum: 50 }
                skill_level:   { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }
                district_code: { type: string }
      responses:
        '200':
          description: Doi sau khi luu
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: '#/components/schemas/Team' }

  /api/complaints:
    post:
      tags: [Khieu nai]
      summary: Gui khieu nai ve mot don dat cua minh
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code, subject, content]
              properties:
                booking_code: { type: string }
                subject:      { type: string, maxLength: 200 }
                content:      { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Da tao phieu khieu nai (status NEW)

  /api/complaints/me:
    get:
      tags: [Khieu nai]
      summary: Khieu nai cua toi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sach phieu kem ket qua xu ly

  /api/owner/venues:
    get:
      tags: [Chu san - Van hanh]
      summary: Cum san cua chu san (moi trang thai; admin thay tat ca)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sach cum san

  /api/owner/bookings:
    get:
      tags: [Chu san - Van hanh]
      summary: Don dat cua mot cum san
      security:
        - BearerAuth: []
      parameters:
        - { name: venue_id, in: query, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, example: 'HELD,PENDING_VERIFY' }, description: Loc theo trang thai, cach nhau dau phay }
      responses:
        '200':
          description: Don kem khach hang, khung gio, dich vu va lan thanh toan gan nhat
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/owner/bookings/{code}/confirm:
    post:
      tags: [Chu san - Van hanh]
      summary: Xac nhan da nhan coc (HELD / PENDING_VERIFY -> CONFIRMED)
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Don da xac nhan, thanh toan cho duyet chuyen SUCCESS

  /api/owner/bookings/{code}/reject:
    post:
      tags: [Chu san - Van hanh]
      summary: Tu choi / huy don cua khach (CANCELLED_BY_OWNER)
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Da huy don va nha khung gio

  /api/owner/locks:
    post:
      tags: [Chu san - Van hanh]
      summary: Khoa slot (bao tri) hoac tao don cho khach goi dien / tai quay
      description: |
        Tao don `OWNER_LOCK` voi slot `LOCKED`. `WALK_IN` tinh tien theo bang gia va bat buoc `guest_name`;
        `MAINTENANCE` / `OTHER` gia 0.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_id, play_date, start, end, reason]
              properties:
                field_id:    { type: integer }
                play_date:   { type: string, format: date }
                start:       { type: string, example: '19:00' }
                end:         { type: string, example: '20:30' }
                reason:      { type: string, enum: [WALK_IN, MAINTENANCE, OTHER] }
                guest_name:  { type: string }
                guest_phone: { type: string }
                note:        { type: string }
      responses:
        '201':
          description: Da khoa slot
        '409':
          description: '`SLOT_TAKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/owner/locks/{code}:
    delete:
      tags: [Chu san - Van hanh]
      summary: Mo lai slot da khoa
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Da mo slot

  /api/owner/venues/{id}/flash-sale:
    get:
      tags: [Chu san - Van hanh]
      summary: Cau hinh Flash Sale hien tai
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: '`flash_sale` = null neu chua cau hinh'
    put:
      tags: [Chu san - Van hanh]
      summary: Bat / tat / sua Flash Sale gio vang
      description: Slot con trong va cach gio da <= `trigger_hours_before` gio duoc giam `discount_percent`%.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discount_percent, trigger_hours_before]
              properties:
                is_active:            { type: boolean, default: true }
                discount_percent:     { type: integer, minimum: 1, maximum: 90 }
                trigger_hours_before: { type: integer, minimum: 1, maximum: 48 }
      responses:
        '200':
          description: Cau hinh sau khi luu

  /api/admin/users/{id}/status:
    put:
      tags: [Quan tri - Quan ly Nguoi dung]
      summary: Khoa / mo khoa tai khoan
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, LOCKED] }
      responses:
        '200':
          description: Da cap nhat trang thai

  /api/admin/complaints:
    get:
      tags: [Quan tri - Khieu nai]
      summary: Danh sach khieu nai
      security:
        - BearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, example: 'NEW,IN_PROGRESS' } }
      responses:
        '200':
          description: Phieu kem don, san, nguoi khieu nai va so tien coc da thanh toan (`paid_amount`)

  /api/admin/complaints/{id}/resolve:
    post:
      tags: [Quan tri - Khieu nai]
      summary: Xu ly khieu nai (hoan coc hoac tu choi)
      description: '`REFUND` hoan 100% cac khoan coc SUCCESS, don chuyen REFUNDED va nha slot.'
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, resolution]
              properties:
                outcome:    { type: string, enum: [REFUND, REJECT] }
                resolution: { type: string }
      responses:
        '200':
          description: Phieu da RESOLVED, kem `refunded_amount`

  /api/admin/reports:
    get:
      tags: [Quan tri - Bao cao]
      summary: Bao cao thang nay va ty le lap day theo khung gio (30 ngay)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bao cao
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: object
                    properties:
                      bookings:        { type: integer }
                      cancelled:       { type: integer }
                      gmv:             { type: number }
                      matched_posts:   { type: integer }
                      open_complaints: { type: integer }
                  occupancy:
                    type: array
                    items:
                      type: object
                      properties:
                        label:            { type: string, example: '17:30 - 21:00' }
                        used_minutes:     { type: integer }
                        capacity_minutes: { type: integer }
                        rate:             { type: number, description: Phan tram }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    VenueId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    FieldId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Chua dang nhap hoac token het han (`UNAUTHORIZED` / `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Khong du quyen (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Khong tim thay du lieu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DbUnavailable:
      description: Khong ket noi duoc co so du lieu (`DB_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SkillLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO]
      description: Moi choi / Trung binh / Kha / Phui
    Position:
      type: string
      enum: [GK, DF, MF, FW, ANY]
      description: Thu mon / Hau ve / Tien ve / Tien dao / Da tu do
    RecruitPost:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [OPEN, MATCHED, CLOSED, EXPIRED] }
        team_name: { type: string, nullable: true }
        author_name: { type: string }
        venue_name: { type: string }
        field_name: { type: string }
        district_name: { type: string }
        play_date: { type: string, format: date }
        time_span: { type: string, example: '[1140,1230)', description: Phut trong ngay }
        required_level: { $ref: '#/components/schemas/SkillLevel' }
        slots_needed: { type: integer }
        slots_filled: { type: integer }
        positions: { type: array, items: { $ref: '#/components/schemas/Position' } }
        cost_kind: { type: string, enum: [FREE, FIXED, VOLUNTARY] }
        cost_amount: { type: number, nullable: true }
        bumped_at: { type: string, format: date-time, nullable: true }
        my_request_status: { type: string, nullable: true }
        pending_requests: { type: integer, nullable: true, description: Chi co khi nguoi xem la chu bai }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, timestamp]
          properties:
            code:
              type: string
              description: Ma loi on dinh, client xu ly theo ma nay
              enum:
                - VALIDATION_ERROR
                - MISSING_FIELD
                - INVALID_TIME_RANGE
                - CONSTRAINT_VIOLATED
                - INVALID_PHONE
                - WEAK_PASSWORD
                - UNAUTHENTICATED
                - FORBIDDEN
                - INVALID_CREDENTIALS
                - NOT_FOUND
                - VENUE_NOT_FOUND
                - FIELD_NOT_FOUND
                - BOOKING_NOT_FOUND
                - ROUTE_NOT_FOUND
                - SLOT_TAKEN
                - PHONE_TAKEN
                - VENUE_NOT_APPROVED
                - NO_PRICE_RULE
                - INVALID_STATUS
                - HOLD_EXPIRED
                - PRICE_SLOT_OVERLAP
                - DB_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_IMPLEMENTED
            message:   { type: string, description: Cau thong bao tieng Viet cho nguoi dung }
            details:   { type: object, description: Thong tin phu de debug hoac to mau o truong sai }
            requestId: { type: string, description: Trung voi header X-Request-Id }
            timestamp: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [phone, password, full_name]
      properties:
        phone:         { type: string, example: '0912345678', description: '10 so, bat dau bang 0' }
        password:      { type: string, format: password, example: matkhau123, description: Toi thieu 6 ky tu }
        full_name:     { type: string, example: Nguyen Van A }
        district_code: { type: string, example: CG }

    LoginRequest:
      type: object
      required: [password]
      properties:
        email:         { type: string, example: 'user@example.com', nullable: true, description: 'Email hoac phone_number, mot trong hai la bat buoc' }
        phone_number:  { type: string, example: '0912345678', nullable: true, description: '10 chu so, bat dau bang 0' }
        password:      { type: string, format: password, example: 'password123' }

    User:
      type: object
      properties:
        id:             { type: integer }
        phone:          { type: string, example: '0912345678' }
        role:           { type: string, enum: [PLAYER, OWNER, ADMIN] }
        status:         { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
        phone_verified: { type: boolean }
        full_name:      { type: string }
        district_code:  { type: string }
        skill_level:    { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }

    AuthResponse:
      type: object
      properties:
        access_token:  { type: string, description: JWT, het han theo JWT_ACCESS_EXPIRES }
        refresh_token: { type: string, description: JWT, het han theo JWT_REFRESH_EXPIRES }
        user:          { $ref: '#/components/schemas/User' }

    District:
      type: object
      properties:
        code: { type: string, example: CG }
        name: { type: string, example: Cau Giay }

    VenueSummary:
      type: object
      properties:
        id:            { type: integer }
        name:          { type: string, example: San Cau Giay Center }
        address:       { type: string }
        district_code: { type: string }
        district_name: { type: string }
        phone:         { type: string }
        avg_rating:    { type: number, format: float, example: 4.6 }
        rating_count:  { type: integer, example: 128 }
        open_time:     { type: string, example: '05:00:00' }
        close_time:    { type: string, example: '23:00:00' }
        deposit_rate:  { type: number, format: float, example: 0.3 }
        field_count:   { type: integer, example: 6 }
        min_price:     { type: integer, description: Gia thap nhat moi gio, dong, example: 250000 }
        amenities:
          type: array
          items: { type: string }
          example: [Den, Cang tin]

    PricingRule:
      type: object
      properties:
        id:            { type: integer }
        venue_id:      { type: integer }
        field_type:    { type: string, example: '5-a-side' }
        day_type:      { type: string, enum: [WEEKDAY, WEEKEND, HOLIDAY] }
        from_minute:   { type: integer, description: 'Phut tinh tu 00:00, VD: 540 = 09:00' }
        to_minute:     { type: integer }
        from_time:     { type: string, example: '09:00', description: 'Chuoi thoi gian (format HH:MM)' }
        to_time:       { type: string, example: '10:00' }
        base_price:    { type: number, example: 250000, description: 'Gia co so (VND/gio)' }
        multiplier:    { type: number, example: 1.2, description: 'He so nhan (0.1-5)' }
        label:         { type: string, example: 'Gio vang', nullable: true }
        created_at:    { type: string, format: date-time }

    CreatePricingRuleRequest:
      type: object
      required: [field_type, day_type, from_time, to_time, base_price]
      properties:
        field_type:  { type: string, example: '5-a-side' }
        day_type:    { type: string, enum: [WEEKDAY, WEEKEND, HOLIDAY] }
        from_time:   { type: string, example: '09:00' }
        to_time:     { type: string, example: '10:00' }
        base_price:  { type: number, example: 250000 }
        multiplier:  { type: number, example: 1.0 }
        label:       { type: string, nullable: true }

    UpdatePricingRuleRequest:
      type: object
      properties:
        field_type:  { type: string }
        day_type:    { type: string }
        from_time:   { type: string }
        to_time:     { type: string }
        base_price:  { type: number }
        multiplier:  { type: number }
        label:       { type: string, nullable: true }

    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/VenueSummary'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  id:        { type: integer }
                  name:      { type: string, example: San 7 so 1 }
                  type:      { type: string, enum: [F5, F7, F11] }
                  is_active: { type: boolean }
            price_rules:
              type: array
              items:
                type: object
                properties:
                  field_type:     { type: string }
                  day_type:       { type: string, enum: [WEEKDAY, WEEKEND] }
                  from_minute:    { type: integer, description: Phut tinh tu 00:00, example: 1170 }
                  to_minute:      { type: integer, example: 1290 }
                  base_price:     { type: integer }
                  multiplier:     { type: number }
                  label:          { type: string, example: Gio vang }
                  price_per_hour: { type: integer }
            services:
              type: array
              items:
                type: object
                properties:
                  id:    { type: integer }
                  name:  { type: string, example: Thue 2 bo ao bib }
                  price: { type: integer }
            flash_sale:
              type: object
              nullable: true
              properties:
                discount_percent:     { type: integer }
                trigger_hours_before: { type: integer }
                floor_price:          { type: number, nullable: true }
                applies_field_type:   { type: string, nullable: true }
                time_spans:
                  type: array
                  nullable: true
                  description: Khung gio duoc ap dung (phut trong ngay); null = ca ngay
                  items:
                    type: object
                    properties:
                      from_minute: { type: integer }
                      to_minute:   { type: integer }

    Slot:
      type: object
      properties:
        field_id:  { type: integer }
        play_date: { type: string, format: date }
        start_at:  { type: string, format: date-time }
        end_at:    { type: string, format: date-time }
        status:
          type: string
          enum: [AVAILABLE, HELD, BOOKED, BLOCKED]
        price:     { type: integer }

    CreateBookingRequest:
      type: object
      required: [field_id, play_date, start, end, user_id]
      properties:
        field_id:    { type: integer, example: 3 }
        play_date:   { type: string, format: date, example: '2026-09-20' }
        start:       { type: string, example: '19:30' }
        end:         { type: string, example: '21:00' }
        user_id:     { type: integer, description: Nguoi dat, bat buoc theo rang buoc ck_booking_owner }
        guest_name:  { type: string, description: Thong tin lien he them, khong thay the user_id }
        guest_phone: { type: string, example: '0912345678' }
        note:        { type: string }
        service_ids:
          type: array
          items: { type: integer }
          description: Dich vu cong them (lay tu `services` cua chi tiet san); gia lay tu CSDL
        pay_full:    { type: boolean, default: false, description: Coc 100% thay vi theo ty le coc cua san }
        looking_for_rival:
          type: boolean
          default: false
          description: Tu dang bai TEAM_FINDS_TEAM len san cap keo; can co doi (`TEAM_REQUIRED` neu chua)
        deal_note:   { type: string, example: Chia doi tien san }

    Team:
      type: object
      properties:
        id:               { type: integer }
        name:             { type: string }
        captain_id:       { type: integer }
        district_code:    { type: string, nullable: true }
        skill_level:      { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }
        member_count:     { type: integer }
        reputation_score: { type: integer }
        total_matches:    { type: integer }

    Booking:
      type: object
      properties:
        id:              { type: integer }
        code:            { type: string, example: BK260914A7K2M }
        kind:            { type: string, enum: [SINGLE, RECURRING, OWNER_LOCK] }
        status:
          type: string
          enum: [HELD, PENDING_VERIFY, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED_EXPIRED, CANCELLED_BY_USER, CANCELLED_BY_OWNER, REFUNDED]
        venue_id:        { type: integer }
        user_id:         { type: integer }
        total_amount:    { type: integer, example: 375000 }
        deposit_amount:  { type: integer, example: 112500 }
        hold_expires_at: { type: string, format: date-time }
        hours:           { type: number, example: 1.5 }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            venue_name: { type: string }
            payments:
              type: array
              items:
                type: object
                properties:
                  id:           { type: integer }
                  method:       { type: string, enum: [VNPAY, TRANSFER, CASH, MOMO] }
                  status:       { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
                  amount:       { type: integer }
                  provider_ref: { type: string }
                  paid_at:      { type: string, format: date-time }

    MatchPost:
      type: object
      properties:
        id:             { type: integer }
        type:           { type: string, enum: [TEAM_FINDS_TEAM, TEAM_FINDS_PLAYER, PLAYER_FINDS_TEAM] }
        status:         { type: string, enum: [OPEN, MATCHED, CLOSED, EXPIRED] }
        author_user_id: { type: integer }
        team_id:        { type: integer, nullable: true }
        booking_id:     { type: integer, nullable: true }
        district_code:  { type: string }
        play_date:      { type: string, format: date }
        time_span:      { type: object, nullable: true }
        required_level: { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }
        deal_note:      { type: string, nullable: true, example: 'Chia 5-5' }
        slots_needed:   { type: integer, nullable: true }
        slots_filled:   { type: integer, nullable: true }
        cost_kind:      { type: string, enum: [FREE, FIXED, VOLUNTARY], nullable: true }
        cost_amount:    { type: number, nullable: true }
        content:        { type: string }
        expires_at:     { type: string, format: date-time }
        created_at:     { type: string, format: date-time }
        closed_at:      { type: string, format: date-time, nullable: true }

    MatchPostDetail:
      allOf:
        - $ref: '#/components/schemas/MatchPost'
        - type: object
          properties:
            requests:
              type: array
              items: { $ref: '#/components/schemas/JoinRequest' }

    CreateMatchPostRequest:
      type: object
      required: [type, district_code, play_date, expires_at]
      properties:
        type:           { type: string, enum: [TEAM_FINDS_TEAM, TEAM_FINDS_PLAYER, PLAYER_FINDS_TEAM] }
        team_id:        { type: integer, description: "Bat buoc neu type bat dau bang TEAM_" }
        booking_id:     { type: integer, description: "Bat buoc neu type bat dau bang TEAM_" }
        district_code:  { type: string }
        play_date:      { type: string, format: date }
        time_span:      { type: object, nullable: true }
        required_level: { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO], default: INTERMEDIATE }
        deal_note:      { type: string, nullable: true }
        slots_needed:   { type: integer, description: "Bat buoc neu type=TEAM_FINDS_PLAYER" }
        cost_kind:      { type: string, enum: [FREE, FIXED, VOLUNTARY], description: "Bat buoc neu type=TEAM_FINDS_PLAYER" }
        cost_amount:    { type: number, nullable: true }
        content:        { type: string }
        expires_at:     { type: string, format: date-time }

    JoinRequest:
      type: object
      properties:
        id:                 { type: integer }
        post_id:            { type: integer }
        requester_user_id:  { type: integer }
        requester_team_id:  { type: integer, nullable: true }
        message:            { type: string }
        status:             { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED] }
        level_warning_ack:  { type: boolean }
        responded_at:       { type: string, format: date-time, nullable: true }
        created_at:         { type: string, format: date-time }

    Conversation:
      type: object
      properties:
        id:              { type: integer }
        match_post_id:   { type: integer, nullable: true }
        booking_id:      { type: integer, nullable: true }
        message_count:   { type: integer }
        created_at:      { type: string, format: date-time }

    Message:
      type: object
      properties:
        id:              { type: integer }
        conversation_id: { type: integer }
        sender_id:       { type: integer }
        content:         { type: string }
        created_at:      { type: string, format: date-time }
