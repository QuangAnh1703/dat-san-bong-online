      summary: Chu bai dong bai; yeu cau dang cho bi tu choi
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Da dong
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Bai khong con mo (`POST_NOT_OPEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/freelance/requests/{id}:
    put:
      tags: [Ghep chan le]
      summary: Chu bai phan hoi - doi truong duyet nguoi xin (APPLY), nguoi choi nhan/tu choi loi moi (INVITE)
      description: >-
        Chap nhan: them nguoi choi vao match_participant, tru so cho can tuyen; du nguoi thi bai chuyen MATCHED
        va cac yeu cau con cho bi tu choi. Ca hai phia deu nhan thong bao.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200':
          description: Da phan hoi
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`RECRUIT_FULL`, `INVITE_EXPIRED` (qua 30 phut), `INVALID_STATUS`, `BOOKING_ALREADY_STARTED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

