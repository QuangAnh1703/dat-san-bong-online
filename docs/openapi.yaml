        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACCEPTED, REJECTED] }
      responses:
        '200':
          description: Da phan hoi
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`RECRUIT_FULL`, `INVITE_EXPIRED` (qua 30 phut), `INVALID_STATUS`, `BOOKING_ALREADY_STARTED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

