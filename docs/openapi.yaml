      description: Chi thanh vien nhom (`FORBIDDEN` neu khong). `after` = id tin cuoi da co, dung cho polling.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: after, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: '`{ count, data: [{ id, sender_id, sender_name, content, created_at }] }` (toi da 200 tin)'
    post:
      tags: [Cong dong - Ghep doi]
      summary: Gui tin nhan
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: '`{ data: { id, sender_id, content, created_at } }`'

