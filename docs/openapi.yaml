      responses:
        '201':
          description: Da gui loi moi (kem expires_at)
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`REQUEST_ALREADY_EXISTS` (loi moi con hieu luc), `ALREADY_IN_MATCH`, `POST_NOT_OPEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/freelance/posts/{id}/requests:
    get:
      tags: [Ghep chan le]
