  /api/owner/locks:
    post:
      tags: [Chu san - Van hanh]
      summary: Khoa slot (bao tri) hoac tao don cho khach goi dien / tai quay
      description: |
        Tao don `OWNER_LOCK` voi slot `LOCKED`. `WALK_IN` tinh tien theo bang gia va bat buoc `guest_name`;
        `MAINTENANCE` / `OTHER` gia 0.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_id, play_date, start, end, reason]
              properties:
                field_id:    { type: integer }
                play_date:   { type: string, format: date }
                start:       { type: string, example: '19:00' }
                end:         { type: string, example: '20:30' }
                reason:      { type: string, enum: [WALK_IN, MAINTENANCE, OTHER] }
                guest_name:  { type: string }
                guest_phone: { type: string }
                note:        { type: string }
      responses:
        '201':
          description: Da khoa slot
        '409':
          description: '`SLOT_TAKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/owner/locks/{code}:
    delete:
      tags: [Chu san - Van hanh]
      summary: Mo lai slot da khoa
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Da mo slot

  /api/owner/venues/{id}/flash-sale:
    get:
      tags: [Chu san - Van hanh]
      summary: Cau hinh Flash Sale hien tai
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: '`flash_sale` = null neu chua cau hinh'
    put:
      tags: [Chu san - Van hanh]
      summary: Bat / tat / sua Flash Sale gio vang
      description: Slot con trong va cach gio da <= `trigger_hours_before` gio duoc giam `discount_percent`%.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discount_percent, trigger_hours_before]
              properties:
                is_active:            { type: boolean, default: true }
                discount_percent:     { type: integer, minimum: 1, maximum: 90 }
                trigger_hours_before: { type: integer, minimum: 1, maximum: 48 }
      responses:
        '200':
          description: Cau hinh sau khi luu

  /api/admin/users/{id}/status:
    put:
      tags: [Quan tri - Quan ly Nguoi dung]
      summary: Khoa / mo khoa tai khoan
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, LOCKED] }
                confirm: { type: boolean, default: false, description: Xac nhan khoa chu san con don chua dien ra }
      responses:
        '200':
          description: '`{ message, user, cancelled_bookings }`'
        '409':
          description: |
            `OWNER_HAS_UPCOMING_BOOKINGS` - chu san con `details.count` don chua dien ra.
            Gui lai voi `confirm: true` de khoa, huy cac don do va thong bao cho nguoi dat.

  /api/admin/complaints:
    get:
      tags: [Quan tri - Khieu nai]
      summary: Danh sach khieu nai
      security:
        - BearerAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string, example: 'NEW,IN_PROGRESS' } }
      responses:
        '200':
          description: Phieu kem don, san, nguoi khieu nai va so tien coc da thanh toan (`paid_amount`)

  /api/admin/complaints/{id}:
    get:
      tags: [Quan tri - Khieu nai]
      summary: Ho so khieu nai de xac minh
      description: |
        Kem don dat san + khung gio, giao dich coc, nhat ky chat cua tran, trao doi voi nguoi gui, bang chung,
        danh sach nguoi lien quan (`parties`: nguoi dat, chu san, nguoi tham gia). Ticket `NEW` -> `IN_PROGRESS`.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Ho so day du

  /api/admin/complaints/{id}/request-info:
    post:
      tags: [Quan tri - Khieu nai]
      summary: Yeu cau nguoi gui bo sung thong tin (han 24h)
      description: Ticket -> `NEED_INFO`, `info_due_at = now + 24h`, gui thong bao. Qua han thi danh sach tra `info_overdue = true`.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: '`{ id, code, status, info_due_at }`'

  /api/admin/complaints/{id}/resolve:
    post:
      tags: [Quan tri - Khieu nai]
      summary: Ra phan quyet va dong khieu nai
      description: |
        `REFUND` hoan 100% coc da thu (don -> `REFUNDED`, nha slot); `REJECT` khong hoan.
        Kem theo co the tru diem uy tin (`penalty_user_id`, `penalty_points` 1-50) va/hoac khoa tai khoan (`lock_user_id`);
        chi ap dung cho nguoi lien quan toi don. Nguoi gui nhan thong bao ket qua.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, resolution]
              properties:
                outcome:         { type: string, enum: [REFUND, REJECT] }
                resolution:      { type: string }
                penalty_user_id: { type: integer }
                penalty_points:  { type: integer, minimum: 1, maximum: 50 }
                lock_user_id:    { type: integer }
      responses:
        '200':
          description: '`{ id, code, status, resolution, closed_at, refunded_amount }`'

  /api/admin/reports:
    get:
      tags: [Quan tri - Bao cao]
      summary: Bao cao toan he thong theo khoang ngay (toi da 366 ngay)
      description: |
        Mac dinh tu dau thang toi hom nay. Tra ve `summary` (luot dat, huy, doanh thu, tien coc, lap day),
        `series` theo ngay (hoac theo thang khi > 62 ngay), `occupancy` theo khung gio, `top_venues`, `open_complaints`.
        Qua 366 ngay -> `INVALID_TIME_RANGE`, dung `/export`.
      security:
        - BearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Bao cao

  /api/admin/reports/export:
    get:
      tags: [Quan tri - Bao cao]
      summary: Xuat bao cao CSV (mo bang Excel)
      description: <= 366 ngay tra file ngay; dai hon tra 202 va xu ly nen, gui file qua email cua admin.
      security:
        - BearerAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: File `text/csv` (UTF-8 BOM)
        '202':
          description: '`{ queued: true, email }` - bao cao se gui qua email'

  /api/owner/reports:
    get:
      tags: [Chu san - Van hanh]
      summary: Bao cao cum san theo Ngay / Tuan / Thang
      description: Cung cau truc voi bao cao he thong, loc theo `venue_id`. Co the thay `period` bang `from` / `to`.
      security:
        - BearerAuth: []
      parameters:
        - { name: venue_id, in: query, required: true, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string, enum: [day, week, month], default: month } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Bao cao (`empty = true` khi chua co du lieu)

  /api/payments/vnpay:
    post:
      tags: [Thanh toan]
      summary: Tao giao dich VNPay cho tien coc
      description: |
        Don phai `HELD` va con han giu cho. Tra `payment_url` de chuyen trinh duyet sang VNPay; han giao dich = han giu cho.
        Chua cau hinh `VNPAY_TMN_CODE` / `VNPAY_HASH_SECRET` (khong phai production) -> URL tro toi cong gia lap.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code]
              properties:
                booking_code: { type: string }
      responses:
        '201':
          description: '`{ payment_url, txn_ref, mock }`'
        '409':
          description: '`INVALID_STATUS` / `HOLD_EXPIRED`'

  /api/payments/vnpay/return:
    get:
      tags: [Thanh toan]
      summary: VNPay chuyen trinh duyet ve
      description: |
        Kiem chu ky HMAC-SHA512 va so tien, ghi `payment_transaction` (chong xu ly trung), thanh cong thi don -> `CONFIRMED`
        va bao cho nguoi dat + chu san. Redirect `FRONTEND_URL/thanh-toan/ket-qua?status=success|failed|late|invalid&code=`.

  /api/payments/vnpay/ipn:
    get:
      tags: [Thanh toan]
      summary: IPN server-to-server cua VNPay
      description: Cung xu ly voi return URL. Tra `{ RspCode, Message }` theo dac ta VNPay (00, 01, 02, 04, 97, 99).

  /api/payments/bank/config:
    get:
      tags: [Thanh toan]
      summary: Che do doi soat chuyen khoan
      responses:
        '200':
          description: '`{ auto_match: true, mock }` - `mock` = true khi chua cau hinh `BANK_WEBHOOK_API_KEY` (khong phai production)'

  /api/payments/bank/webhook:
    post:
      tags: [Thanh toan]
      summary: Webhook bien dong so du (dinh dang SePay)
      description: |
        Header `Authorization: Apikey <BANK_WEBHOOK_API_KEY>`. Chi xu ly `transferType = in`; goi lai cung `id` -> `duplicate`.
        Boc ma don `BK......` tu noi dung chuyen khoan (bo qua dau cach, hoa thuong) roi khop:
        - Du coc -> don `CONFIRMED`, slot khoa, payment `SUCCESS`, bao nguoi dat + chu san (`confirmed`)
        - Thieu -> don giu `HELD`, gia han giu cho toi thieu 5 phut, bao so tien con thieu (`underpaid`)
        - Khong co ma don / sai tai khoan nhan / don da xac nhan tu truoc -> hang doi doi soat thu cong (`unmatched`)
        - Don het han: slot con trong thi giu lai don va xac nhan; da co nguoi dat de hoac don da huy -> cho hoan (`refund_pending`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, transferType, transferAmount]
              properties:
                id:              { type: integer, description: Ma giao dich ben SePay }
                gateway:         { type: string, example: Vietcombank }
                transactionDate: { type: string, example: '2026-10-27 22:00:00' }
                accountNumber:   { type: string }
                content:         { type: string, example: 'SANBONG BK261027ABCDE' }
                transferType:    { type: string, enum: [in, out] }
                transferAmount:  { type: number }
                referenceCode:   { type: string }
      responses:
        '200':
          description: '`{ success: true, result: confirmed | underpaid | unmatched | refund_pending | duplicate | ignored, booking_code?, transaction_id? }`'
        '401':
          description: '`BANK_WEBHOOK_UNAUTHORIZED`'

  /api/payments/bank/mock-transfer:
    post:
      tags: [Thanh toan]
      summary: Gia lap ngan hang bao co (chi moi truong phat trien)
      description: Chi bat khi chua cau hinh webhook. Nguoi dat (hoac admin) gui thu; xu ly giong webhook that.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code]
              properties:
                booking_code: { type: string }
                amount:       { type: number, description: Mac dinh = tien coc }
                content:      { type: string, description: 'Mac dinh `SANBONG <ma don>`; nhan ca QUY / NAP / GIAI de test quy doi, nap vi, le phi giai' }
      responses:
        '201':
          description: Ket qua khop lenh, giong webhook
        '404':
          description: '`ROUTE_NOT_FOUND` khi da cau hinh webhook that'

  /api/payments/bank/transactions:
    get:
      tags: [Thanh toan]
      summary: Hang doi doi soat chuyen khoan
      description: |
        OWNER thay giao dich vao so tai khoan cua cum san minh (hoac da gan voi don cua cum san minh); ADMIN thay tat ca.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: 'Danh sach cach nhau dau phay. Mac dinh `UNMATCHED,REFUND_PENDING`'
          schema: { type: string, example: 'UNMATCHED' }
      responses:
        '200':
          description: '`{ count, data: [{ id, amount, content, account_number, bank_name, status, note, received_at, booking_code, booking_status, venue_name, customer_name }] }`'

  /api/payments/bank/transactions/{id}/assign:
    post:
      tags: [Thanh toan]
      summary: Gan tay giao dich khong khop vao don
      description: 'Giao dich phai `UNMATCHED`; don phai thuoc cum san cua chu san (admin moi don) va chua xac nhan coc.'
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code]
              properties:
                booking_code: { type: string }
      responses:
        '200':
          description: '`{ result: confirmed | underpaid | refund_pending, booking_code }`'
        '404':
          description: '`TRANSACTION_NOT_FOUND` / `BOOKING_NOT_FOUND`'
        '409':
          description: '`TRANSACTION_ALREADY_HANDLED` / `INVALID_STATUS`'

  /api/payments/bank/transactions/{id}/resolve:
    post:
      tags: [Thanh toan]
      summary: Danh dau da hoan tien / ghi nhan
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [REFUNDED, IGNORED] }
                note:   { type: string, maxLength: 300 }
      responses:
        '200':
          description: '`{ id, status, note, handled_at }`'
        '409':
          description: '`TRANSACTION_ALREADY_HANDLED`'

  /api/owner/venues/{id}/services:
    get:
      tags: [Chu san - Dich vu]
      summary: Menu va ton kho (ca mon da an)
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "`{ count, data: [{ id, name, price, category, stock, is_active }] }`"

    post:
      tags: [Chu san - Dich vu]
      summary: Them mat hang
      description: |
        category DRINK | RENTAL | BALL | REFEREE | OTHER; stock null = khong quan kho.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                category: { type: string }
                stock: { type: integer, nullable: true }
      responses:
        '201':
          description: "Mat hang moi"

  /api/owner/services/{id}:
    put:
      tags: [Chu san - Dich vu]
      summary: Sua mat hang, ton kho, an / hien
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                category: { type: string }
                stock: { type: integer, nullable: true }
                is_active: { type: boolean }
      responses:
        '200':
          description: "OK"

  /api/owner/venues/{id}/pos:
    get:
      tags: [Chu san - Dich vu]
      summary: Man POS - o san trong ngay, menu, don quay trong ngay
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: "`{ bookings, services, orders }`"

  /api/owner/venues/{id}/pos-orders:
    post:
      tags: [Chu san - Dich vu]
      summary: Ban tai quay
      description: |
        Tru kho ngay, het hang -> 409 `OUT_OF_STOCK`. `ADD_TO_BOOKING` can `booking_code`, thu khi check-out.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: { type: array, items: { type: object, properties: { service_id: { type: integer }, quantity: { type: integer } } } }
                pay_mode: { type: string, enum: [CASH, QR, ADD_TO_BOOKING] }
                booking_code: { type: string }
      responses:
        '201':
          description: "Don quay"

  /api/owner/bookings/{code}/checkout:
    get:
      tags: [Chu san - Dich vu]
      summary: Tien con thu va do cho thue can kiem
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "`{ items, rentals, field_remaining, unpaid_services, amount_due, checked_out_at }`"

    post:
      tags: [Chu san - Dich vu]
      summary: Hoan tat don / check-out
      description: |
        Don co do cho thue bat buoc gui `rentals_returned` (khong gui -> 409 `RENTAL_CHECK_REQUIRED`). Tra du -> cong lai kho.
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rentals_returned: { type: boolean }
                missing_note: { type: string }
      responses:
        '200':
          description: "`{ code, checked_out, amount_collected }`"

  /api/splits/mine:
    get:
      tags: [So quy doi bong]
      summary: Cac khoan minh con phai dong
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "`{ count, data: [{ id, amount, booking_code, venue_name, due_at, starts_at, captain_name }] }`"

  /api/splits/booking/{code}:
    get:
      tags: [So quy doi bong]
      summary: So quy tran
      description: |
        Doi truong, thanh vien trong danh sach chia va nguoi tham gia tran xem duoc.
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "`{ booking, is_captain, my_phone, bill | null }`"

    post:
      tags: [So quy doi bong]
      summary: Doi truong chia tien tran
      description: |
        Chi tran da xac nhan, moi tran mot lan (409 `SPLIT_EXISTS`). EQUAL / SPONSOR lam tron LEN hang nghin, tien thua vao quy doi khi ca doi dong du; CUSTOM phai khop tong chi phi (400 `SPLIT_AMOUNT_MISMATCH`). Noi dung chuyen khoan cua thanh vien `QUY <ma tran> <SDT>`.
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [EQUAL, SPONSOR, CUSTOM] }
                sponsor_percent: { type: integer }
                members: { type: array, items: { type: object, properties: { name: { type: string }, phone: { type: string }, amount: { type: number } } } }
                due_hours_before: { type: number }
                bank_name: { type: string }
                bank_account: { type: string }
                bank_holder: { type: string }
      responses:
        '201':
          description: "So quy"

  /api/splits/booking/{code}/candidates:
    get:
      tags: [So quy doi bong]
      summary: Thanh vien doi, chan le da ghep, tong chi phi
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "`{ total, field_and_online_services, pos_services, members, last_bank }`"

  /api/splits/shares/{id}/mark-paid:
    post:
      tags: [So quy doi bong]
      summary: Doi truong xac nhan da thu
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "OK"

  /api/splits/shares/{id}/pay-for:
    post:
      tags: [So quy doi bong]
      summary: Doi truong dong thay
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "OK"

  /api/splits/shares/{id}/reassign:
    post:
      tags: [So quy doi bong]
      summary: Doi nguoi dong
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: "Phan moi"

  /api/wallets/venues/{venueId}/plans:
    get:
      tags: [Vi hoi vien]
      summary: Goi dang ban cua cum san
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "OK"

  /api/wallets/venues/{venueId}/me:
    get:
      tags: [Vi hoi vien]
      summary: Vi cua toi tai cum san
      security:
        - BearerAuth: []
      parameters:
        - { name: venueId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "`{ wallet | null }`"

  /api/wallets/mine:
    get:
      tags: [Vi hoi vien]
      summary: Moi vi cua toi va giao dich gan day
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "OK"

  /api/wallets/topups:
    post:
      tags: [Vi hoi vien]
      summary: Mua goi - tra thong tin VietQR, noi dung `NAP <ma>`
      description: |
        Tien ve du -> cong vi (nap + tang), nang hang goi neu giam gia cao hon.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: integer }
      responses:
        '201':
          description: "`{ topup, plan, transfer }`"

  /api/wallets/topups/{code}:
    get:
      tags: [Vi hoi vien]
      summary: Trang thai lenh nap
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: "OK"

  /api/wallets/pay:
    post:
      tags: [Vi hoi vien]
      summary: Tra coc bang vi hoi vien
      description: |
        Don HELD con han. Ap % giam cua goi len tien san (giu ti le coc), tru vi; thieu -> `partial`, phan con lai chuyen VietQR. Don het han / bi huy -> job hoan lai vi. 409 `WALLET_EMPTY` / `WALLET_FROZEN`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                booking_code: { type: string }
      responses:
        '200':
          description: "`{ result: confirmed | partial, discount, paid_from_wallet, remaining, deposit }`"

  /api/wallets/owner/venues/{id}/plans:
    get:
      tags: [Vi hoi vien]
      summary: Chu san - goi, so vi, tong so du
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "OK"

    post:
      tags: [Vi hoi vien]
      summary: Chu san - tao goi
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                bonus: { type: number }
                discount_percent: { type: integer, maximum: 50 }
      responses:
        '201':
          description: "Goi moi"

  /api/wallets/owner/plans/{id}:
    put:
      tags: [Vi hoi vien]
      summary: Chu san - sua / ngung ban goi
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                bonus: { type: number }
                discount_percent: { type: integer }
                is_active: { type: boolean }
      responses:
        '200':
          description: "OK"

  /api/wallets/admin/frozen:
    get:
      tags: [Vi hoi vien]
      summary: Admin - vi bi dong bang con so du
      description: |
        Khoa chu san -> vi cua cac cum san do con tien bi FROZEN va bao admin.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "`{ count, total, data }`"

  /api/wallets/admin/{id}/refund:
    post:
      tags: [Vi hoi vien]
      summary: Admin - da hoan so du cho nguoi choi, vi ve 0
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: "OK"

  /api/leaderboard:
    get:
      tags: [Giai dau & Xep hang]
      summary: Bang xep hang doi
      parameters:
        - { name: district, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [elo, wins, streak, reputation] } }
      responses:
        '200':
          description: "`{ count, sort, data: [{ rank, id, name, elo, wins, draws, losses, win_streak, reputation_score, district_name }] }`"

  /api/matches/results/mine:
    get:
      tags: [Giai dau & Xep hang]
      summary: Tran cap keo cua doi minh (can / da nhap ty so)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "OK"

  /api/matches/{code}/result:
    post:
      tags: [Giai dau & Xep hang]
      summary: Doi truong nhap ty so tran cap keo
      description: |
        Hai doi khop -> CONFIRMED, tinh Elo (K = 32 x he so uy tin). Lech -> DISPUTED, 12 tieng de sua; qua han job chuyen VOID, khong tinh Elo.
      security:
        - BearerAuth: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                home_score: { type: integer }
                away_score: { type: integer }
      responses:
        '200':
          description: "`{ status: PENDING | CONFIRMED | DISPUTED, result }`"

  /api/tournaments:
    get:
      tags: [Giai dau & Xep hang]
      summary: Danh sach giai
      parameters:
        - { name: status, in: query, schema: { type: string, example: 'OPEN,ONGOING' } }
        - { name: mine, in: query, description: Giai minh to chuc (can token), schema: { type: integer } }
      responses:
        '200':
          description: "OK"

    post:
      tags: [Giai dau & Xep hang]
      summary: Chu san tao giai
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                venue_id: { type: integer }
                field_id: { type: integer }
                name: { type: string }
                description: { type: string }
                format: { type: string, enum: [ROUND_ROBIN, KNOCKOUT] }
                max_teams: { type: integer }
                fee: { type: number }
                registration_deadline: { type: string, format: date-time }
                start_date: { type: string, format: date }
                daily_start: { type: string, example: '17:00' }
                daily_end: { type: string, example: '22:00' }
                match_minutes: { type: integer, enum: [60, 90, 120] }
      responses:
        '201':
          description: "`{ id }`"

  /api/tournaments/{id}:
    get:
      tags: [Giai dau & Xep hang]
      summary: Chi tiet giai - doi, lich, bang xep hang, dang ky cua doi minh
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "OK"

  /api/tournaments/{id}/register:
    post:
      tags: [Giai dau & Xep hang]
      summary: Doi truong dang ky giai
      description: |
        Co le phi -> PENDING_PAYMENT va noi dung `GIAI <ma>`; tien ve thi REGISTERED. 409 `TOURNAMENT_BANNED` / `TOURNAMENT_FULL`.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201':
          description: "`{ status, fee_code, transfer }`"

  /api/tournaments/{id}/schedule:
    post:
      tags: [Giai dau & Xep hang]
      summary: BTC chia bang va xep lich
      description: |
        Vong tron: hon 5 doi thi chia bang toi da 4 doi. Loai truc tiep: boc tham; goi lai de xep vong sau / chot vo dich. Moi tran giu mot slot (booking OWNER_LOCK) vao khung gio trong cua san.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: "OK"

  /api/tournaments/matches/{id}/result:
    post:
      tags: [Giai dau & Xep hang]
      summary: BTC nhap ket qua tran trong giai
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                home_score: { type: integer }
                away_score: { type: integer }
      responses:
        '200':
          description: "OK"

  /api/tournaments/matches/{id}/forfeit:
    post:
      tags: [Giai dau & Xep hang]
      summary: Doi bo tran
      description: |
        Xu thua 0-3, tru 20 diem uy tin doi, cam dang ky giai 30 ngay, nha slot san. BTC ghi nhan thay thi gui `team_id`.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id: { type: integer }
      responses:
        '200':
          description: "OK"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    VenueId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    FieldId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Chua dang nhap hoac token het han (`UNAUTHORIZED` / `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Khong du quyen (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Khong tim thay du lieu
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DbUnavailable:
      description: Khong ket noi duoc co so du lieu (`DB_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SkillLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO]
      description: Moi choi / Trung binh / Kha / Phui
    Position:
      type: string
      enum: [GK, DF, MF, FW, ANY]
      description: Thu mon / Hau ve / Tien ve / Tien dao / Da tu do
    RecruitPost:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [OPEN, MATCHED, CLOSED, EXPIRED] }
        team_name: { type: string, nullable: true }
        author_name: { type: string }
        venue_name: { type: string }
        field_name: { type: string }
        district_name: { type: string }
        play_date: { type: string, format: date }
        time_span: { type: string, example: '[1140,1230)', description: Phut trong ngay }
        required_level: { $ref: '#/components/schemas/SkillLevel' }
        slots_needed: { type: integer }
        slots_filled: { type: integer }
        positions: { type: array, items: { $ref: '#/components/schemas/Position' } }
        cost_kind: { type: string, enum: [FREE, FIXED, VOLUNTARY] }
        cost_amount: { type: number, nullable: true }
        bumped_at: { type: string, format: date-time, nullable: true }
        my_request_status: { type: string, nullable: true }
        pending_requests: { type: integer, nullable: true, description: Chi co khi nguoi xem la chu bai }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, timestamp]
          properties:
            code:
              type: string
              description: Ma loi on dinh, client xu ly theo ma nay
              enum:
                - VALIDATION_ERROR
                - MISSING_FIELD
                - INVALID_TIME_RANGE
                - CONSTRAINT_VIOLATED
                - INVALID_PHONE
                - WEAK_PASSWORD
                - UNAUTHENTICATED
                - FORBIDDEN
                - INVALID_CREDENTIALS
                - NOT_FOUND
                - VENUE_NOT_FOUND
                - FIELD_NOT_FOUND
                - BOOKING_NOT_FOUND
                - ROUTE_NOT_FOUND
                - SLOT_TAKEN
                - PHONE_TAKEN
                - VENUE_NOT_APPROVED
                - NO_PRICE_RULE
                - INVALID_STATUS
                - HOLD_EXPIRED
                - PRICE_SLOT_OVERLAP
                - DB_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_IMPLEMENTED
            message:   { type: string, description: Cau thong bao tieng Viet cho nguoi dung }
            details:   { type: object, description: Thong tin phu de debug hoac to mau o truong sai }
            requestId: { type: string, description: Trung voi header X-Request-Id }
            timestamp: { type: string, format: date-time }

    VenueInput:
      type: object
      description: Khi tao bat buoc name, address, district_code, phone; khi sua chi gui truong can doi
      properties:
        name:          { type: string, maxLength: 150 }
        address:       { type: string, maxLength: 300 }
        district_code: { type: string }
        phone:         { type: string, example: '0912345678' }
        latitude:      { type: number, nullable: true }
        longitude:     { type: number, nullable: true }
        description:   { type: string }
        open_time:     { type: string, example: '06:00' }
        close_time:    { type: string, example: '23:00' }
        deposit_rate:  { type: number, minimum: 0, maximum: 1, example: 0.3 }
        bank_name:     { type: string }
        bank_account:  { type: string, description: 6-20 chu so }
        bank_holder:   { type: string }
        amenities:     { type: array, items: { type: string }, example: [LIGHT, WIFI] }
        fields:
          type: array
          description: Chi khi tao - danh sach san con
          items:
            type: object
            properties:
              name: { type: string, maxLength: 50 }
              type: { type: string, enum: [F5, F7, F11] }

    RegisterRequest:
      type: object
      required: [phone_number, password, full_name]
      properties:
        phone_number:  { type: string, example: '0912345678', description: '10 so, dau so di dong VN (03/05/07/08/09)' }
        password:      { type: string, format: password, example: matkhau123, description: 'Toi thieu 8 ky tu, gom ca chu va so' }
        full_name:     { type: string, example: Nguyen Van A }
        district_code: { type: string, example: CG }
        role:          { type: string, enum: [PLAYER, OWNER], default: PLAYER }

    LoginRequest:
      type: object
      required: [password]
      properties:
        email:         { type: string, example: 'user@example.com', nullable: true, description: 'Email hoac phone_number, mot trong hai la bat buoc' }
        phone_number:  { type: string, example: '0912345678', nullable: true, description: '10 chu so, bat dau bang 0' }
        password:      { type: string, format: password, example: 'password123' }

    User:
      type: object
      properties:
        id:             { type: integer }
        phone:          { type: string, example: '0912345678' }
        role:           { type: string, enum: [PLAYER, OWNER, ADMIN] }
        status:         { type: string, enum: [PENDING_VERIFY, ACTIVE, LOCKED] }
        phone_verified: { type: boolean }
        full_name:      { type: string }
        district_code:  { type: string }
        skill_level:    { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }

    AuthResponse:
      type: object
      properties:
        access_token:  { type: string, description: JWT, het han theo JWT_ACCESS_EXPIRES }
        refresh_token: { type: string, description: JWT, het han theo JWT_REFRESH_EXPIRES }
        user:          { $ref: '#/components/schemas/User' }

    District:
      type: object
      properties:
        code: { type: string, example: CG }
        name: { type: string, example: Cau Giay }

    VenueSummary:
      type: object
      properties:
        id:            { type: integer }
        name:          { type: string, example: San Cau Giay Center }
        address:       { type: string }
        district_code: { type: string }
        district_name: { type: string }
        phone:         { type: string }
        avg_rating:    { type: number, format: float, example: 4.6 }
        rating_count:  { type: integer, example: 128 }
        open_time:     { type: string, example: '05:00:00' }
        close_time:    { type: string, example: '23:00:00' }
        deposit_rate:  { type: number, format: float, example: 0.3 }
        field_count:   { type: integer, example: 6 }
        min_price:     { type: integer, description: Gia thap nhat moi gio, dong, example: 250000 }
        owner_id:      { type: integer }
        latitude:      { type: number, nullable: true }
        longitude:     { type: number, nullable: true }
        amenities:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: PARKING }
              name: { type: string, example: Bai xe }
        fields:
          type: array
          items:
            type: object
            properties:
              id:        { type: integer }
              venue_id:  { type: integer }
              name:      { type: string }
              type:      { type: string, enum: [F5, F7, F11] }
              is_active: { type: boolean }
        price_rules:
          type: array
          description: Cung dang voi `price_rules` cua `/api/venues/{id}`
          items: { type: object }
        services:
          type: array
          items:
            type: object
            properties:
              id:    { type: integer }
              name:  { type: string }
              price: { type: number }
        flash_sale:
          type: object
          nullable: true
          description: Flash Sale dang hieu luc co muc giam cao nhat
        contract_discounts:
          type: array
          items:
            type: object
            properties:
              discount_percent:    { type: integer }
              min_contract_months: { type: integer, nullable: true }
        schedule:
          type: array
          description: Slot da kin trong ngay `date`
          items:
            type: object
            properties:
              field_id:    { type: integer }
              start_at:    { type: string, format: date-time }
              end_at:      { type: string, format: date-time }
              slot_status: { type: string, enum: [HELD, CONFIRMED, LOCKED] }

    PricingRule:
      type: object
      properties:
        id:            { type: integer }
        venue_id:      { type: integer }
        field_type:    { type: string, example: '5-a-side' }
        day_type:      { type: string, enum: [WEEKDAY, WEEKEND, HOLIDAY] }
        from_minute:   { type: integer, description: 'Phut tinh tu 00:00, VD: 540 = 09:00' }
        to_minute:     { type: integer }
        from_time:     { type: string, example: '09:00', description: 'Chuoi thoi gian (format HH:MM)' }
        to_time:       { type: string, example: '10:00' }
        base_price:    { type: number, example: 250000, description: 'Gia co so (VND/gio)' }
        multiplier:    { type: number, example: 1.2, description: 'He so nhan (0.1-5)' }
        label:         { type: string, example: 'Gio vang', nullable: true }
        created_at:    { type: string, format: date-time }

    CreatePricingRuleRequest:
      type: object
      required: [field_type, day_type, from_time, to_time, base_price]
      properties:
        field_type:  { type: string, example: '5-a-side' }
        day_type:    { type: string, enum: [WEEKDAY, WEEKEND, HOLIDAY] }
        from_time:   { type: string, example: '09:00' }
        to_time:     { type: string, example: '10:00' }
        base_price:  { type: number, example: 250000 }
        multiplier:  { type: number, example: 1.0 }
        label:       { type: string, nullable: true }

    UpdatePricingRuleRequest:
      type: object
      properties:
        field_type:  { type: string }
        day_type:    { type: string }
        from_time:   { type: string }
        to_time:     { type: string }
        base_price:  { type: number }
        multiplier:  { type: number }
        label:       { type: string, nullable: true }

    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/VenueSummary'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  id:        { type: integer }
                  name:      { type: string, example: San 7 so 1 }
                  type:      { type: string, enum: [F5, F7, F11] }
                  is_active: { type: boolean }
            price_rules:
              type: array
              items:
                type: object
                properties:
                  field_type:     { type: string }
                  day_type:       { type: string, enum: [WEEKDAY, WEEKEND] }
                  from_minute:    { type: integer, description: Phut tinh tu 00:00, example: 1170 }
                  to_minute:      { type: integer, example: 1290 }
                  base_price:     { type: integer }
                  multiplier:     { type: number }
                  label:          { type: string, example: Gio vang }
                  price_per_hour: { type: integer }
            services:
              type: array
              items:
                type: object
                properties:
                  id:    { type: integer }
                  name:  { type: string, example: Thue 2 bo ao bib }
                  price: { type: integer }
            flash_sale:
              type: object
              nullable: true
              properties:
                discount_percent:     { type: integer }
                trigger_hours_before: { type: integer }
                floor_price:          { type: number, nullable: true }
                applies_field_type:   { type: string, nullable: true }
                time_spans:
                  type: array
                  nullable: true
                  description: Khung gio duoc ap dung (phut trong ngay); null = ca ngay
                  items:
                    type: object
                    properties:
                      from_minute: { type: integer }
                      to_minute:   { type: integer }

    Slot:
      type: object
      properties:
        field_id:  { type: integer }
        play_date: { type: string, format: date }
        start_at:  { type: string, format: date-time }
        end_at:    { type: string, format: date-time }
        status:
          type: string
          enum: [AVAILABLE, HELD, BOOKED, BLOCKED]
        price:     { type: integer }

    CreateBookingRequest:
      type: object
      required: [field_id, play_date, start, end, user_id]
      properties:
        field_id:    { type: integer, example: 3 }
        play_date:   { type: string, format: date, example: '2026-09-20' }
        start:       { type: string, example: '19:30' }
        end:         { type: string, example: '21:00' }
        user_id:     { type: integer, description: Nguoi dat, bat buoc theo rang buoc ck_booking_owner }
        guest_name:  { type: string, description: Thong tin lien he them, khong thay the user_id }
        guest_phone: { type: string, example: '0912345678' }
        note:        { type: string }
        service_ids:
          type: array
          items: { type: integer }
          description: Dich vu cong them (lay tu `services` cua chi tiet san); gia lay tu CSDL
        pay_full:    { type: boolean, default: false, description: Coc 100% thay vi theo ty le coc cua san }
        looking_for_rival:
          type: boolean
          default: false
          description: Tu dang bai TEAM_FINDS_TEAM len san cap keo; can co doi (`TEAM_REQUIRED` neu chua)
        deal_note:   { type: string, example: Chia doi tien san }

    Team:
      type: object
      properties:
        id:               { type: integer }
        name:             { type: string }
        captain_id:       { type: integer }
        district_code:    { type: string, nullable: true }
        skill_level:      { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }
        member_count:     { type: integer }
        reputation_score: { type: integer }
        total_matches:    { type: integer }

    Booking:
      type: object
      properties:
        id:              { type: integer }
        code:            { type: string, example: BK260914A7K2M }
        kind:            { type: string, enum: [SINGLE, RECURRING, OWNER_LOCK] }
        status:
          type: string
          enum: [HELD, PENDING_VERIFY, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED_EXPIRED, CANCELLED_BY_USER, CANCELLED_BY_OWNER, REFUNDED]
        venue_id:        { type: integer }
        user_id:         { type: integer }
        total_amount:    { type: integer, example: 375000 }
        deposit_amount:  { type: integer, example: 112500 }
        hold_expires_at: { type: string, format: date-time }
        hours:           { type: number, example: 1.5 }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            venue_name: { type: string }
            amount_received:
              type: number
              description: Tong tien chuyen khoan da tu khop vao don (bank_transaction PARTIAL + APPLIED)
            refund_pending_amount:
              type: number
              description: Tien ve khi don da het han / bi huy, dang cho hoan
            payments:
              type: array
              items:
                type: object
                properties:
                  id:           { type: integer }
                  method:       { type: string, enum: [VNPAY, TRANSFER, CASH, MOMO] }
                  status:       { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
                  amount:       { type: integer }
                  provider_ref: { type: string }
                  paid_at:      { type: string, format: date-time }

    MatchPost:
      type: object
      properties:
        id:             { type: integer }
        type:           { type: string, enum: [TEAM_FINDS_TEAM, TEAM_FINDS_PLAYER, PLAYER_FINDS_TEAM] }
        status:         { type: string, enum: [OPEN, MATCHED, CLOSED, EXPIRED] }
        author_user_id: { type: integer }
        team_id:        { type: integer, nullable: true }
        booking_id:     { type: integer, nullable: true }
        district_code:  { type: string }
        play_date:      { type: string, format: date }
        time_span:      { type: object, nullable: true }
        required_level: { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO] }
        deal_note:      { type: string, nullable: true, example: 'Chia 5-5' }
        slots_needed:   { type: integer, nullable: true }
        slots_filled:   { type: integer, nullable: true }
        cost_kind:      { type: string, enum: [FREE, FIXED, VOLUNTARY], nullable: true }
        cost_amount:    { type: number, nullable: true }
        content:        { type: string }
        expires_at:     { type: string, format: date-time }
        created_at:     { type: string, format: date-time }
        closed_at:      { type: string, format: date-time, nullable: true }

    MatchPostDetail:
      allOf:
        - $ref: '#/components/schemas/MatchPost'
        - type: object
          properties:
            requests:
              type: array
              items: { $ref: '#/components/schemas/JoinRequest' }

    CreateMatchPostRequest:
      type: object
      required: [type, district_code, play_date, expires_at]
      properties:
        type:           { type: string, enum: [TEAM_FINDS_TEAM, TEAM_FINDS_PLAYER, PLAYER_FINDS_TEAM] }
        team_id:        { type: integer, description: "Bat buoc neu type bat dau bang TEAM_" }
        booking_id:     { type: integer, description: "Bat buoc neu type bat dau bang TEAM_" }
        district_code:  { type: string }
        play_date:      { type: string, format: date }
        time_span:      { type: object, nullable: true }
        required_level: { type: string, enum: [BEGINNER, INTERMEDIATE, GOOD, SEMI_PRO], default: INTERMEDIATE }
        deal_note:      { type: string, nullable: true }
        slots_needed:   { type: integer, description: "Bat buoc neu type=TEAM_FINDS_PLAYER" }
        cost_kind:      { type: string, enum: [FREE, FIXED, VOLUNTARY], description: "Bat buoc neu type=TEAM_FINDS_PLAYER" }
        cost_amount:    { type: number, nullable: true }
        content:        { type: string }
        expires_at:     { type: string, format: date-time }

    JoinRequest:
      type: object
      properties:
        id:                 { type: integer }
        post_id:            { type: integer }
        requester_user_id:  { type: integer }
        requester_team_id:  { type: integer, nullable: true }
        message:            { type: string }
        status:             { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED, CANCELLED] }
        level_warning_ack:  { type: boolean }
        responded_at:       { type: string, format: date-time, nullable: true }
        created_at:         { type: string, format: date-time }

    Conversation:
      type: object
      properties:
        id:              { type: integer }
        match_post_id:   { type: integer, nullable: true }
        booking_id:      { type: integer, nullable: true }
        message_count:   { type: integer }
        created_at:      { type: string, format: date-time }

    Message:
      type: object
      properties:
        id:              { type: integer }
        conversation_id: { type: integer }
        sender_id:       { type: integer }
        content:         { type: string }
        created_at:      { type: string, format: date-time }
