openapi: 3.0.3

info:
  title: API Nen tang dat san bong da truc tuyen
  version: 1.0.0
  description: |
    Dac ta nhom endpoint loi cua he thong dat san bong da.

    ## Dinh dang phan hoi loi
    Moi loi deu tra ve cung mot cau truc, sinh tai mot cho duy nhat
    (`backend/src/middlewares/errorHandler`):

    ```json
    {
      "error": {
        "code": "SLOT_TAKEN",
        "message": "Khung gio nay da co nguoi dat",
        "details": { "field_id": 3 },
        "requestId": "3f7c...",
        "timestamp": "2026-09-14T12:30:00.000Z"
      }
    }
    ```

    - `code` la ma **on dinh**, client xu ly theo ma nay chu khong theo `message`.
    - `message` la cau tieng Viet de hien thang cho nguoi dung.
    - `requestId` cung xuat hien o header `X-Request-Id`, dung de doi chieu log server.

    Bang ma loi day du xem tai `backend/src/lib/errors.js`.

servers:
  - url: http://localhost:3000
    description: May phat trien

tags:
  - name: He thong
  - name: Xac thuc
  - name: Cum san
  - name: San con
  - name: Bang gia
  - name: Dat san
  - name: Cong dong - Ghep doi
  - name: Ghep chan le
  - name: Thong bao
  - name: Quan tri - Duyet san
  - name: Quan tri - Duyet Chu san
  - name: Quan tri - Quan ly Nguoi dung
  - name: Quan tri - Khieu nai
  - name: Quan tri - Bao cao
  - name: Thanh toan
  - name: Doi bong
  - name: Khieu nai
  - name: Chu san - Van hanh

paths:
  /health:
    get:
      tags: [He thong]
      summary: Kiem tra ket noi co so du lieu
      responses:
        '200':
          description: Ket noi binh thuong
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:      { type: string, example: ok }
                  db:          { type: string, example: sanbong }
                  user:        { type: string, example: sanbong }
                  tables:      { type: integer, example: 21 }
                  server_time: { type: string, format: date-time }
        '503':
          $ref: '#/components/responses/DbUnavailable'

  /api/districts:
    get:
      tags: [He thong]
      summary: Danh sach quan/huyen
      responses:
        '200':
          description: Danh sach quan/huyen
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 6 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/District' }

  /api/auth/register:
    post:
      tags: [Xac thuc]
      summary: Dang ky tai khoan bang so dien thoai
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Tao tai khoan thanh cong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Thieu truong bat buoc, SDT sai dinh dang (`INVALID_PHONE`) hoac mat khau qua ngan (`WEAK_PASSWORD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: SDT da duoc dang ky (`PHONE_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/login:
    post:
      tags: [Xac thuc]
      summary: Dang nhap bang email hoac so dien thoai
      description: |
        Ho tro dang nhap bang email hoac so dien thoai va mat khau.
        - Neu gui `email`: phai la email hop le
        - Neu gui `phone_number`: phai la 10 chu so, bat dau bang 0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Dang nhap thanh cong, nhan JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Thieu email/phone_number hoac password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Email/SDT hoac mat khau sai (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/request-otp:
    post:
      tags: [Xac thuc]
      summary: Yeu cau ma OTP de dang ky
      description: Gui OTP ve SMS (demo hien thi trong log). Con lai 15 phut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '0912345678' }
      responses:
        '200':
          description: OTP gui thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'OTP sent' }
                  phone:   { type: string, example: '5678', description: '4 chu so cuoi cua SDT' }
        '400':
          description: SDT sai dinh dang hoac khong hop le
        '409':
          description: SDT da duoc dang ky (`PHONE_TAKEN`)
        '429':
          description: Nhap sai qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/verify-otp:
    post:
      tags: [Xac thuc]
      summary: Xac minh ma OTP
      description: Neu dung, tra ve temp_token (hieu luc 10 phut) dung de dang ky.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, otp]
              properties:
                phone: { type: string, example: '0912345678' }
                otp:   { type: string, example: '123456', maxLength: 6 }
      responses:
        '200':
          description: OTP dung, nhan temp_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp_token: { type: string, description: 'Dung de /register-with-otp' }
        '400':
          description: OTP khong dung, het han, hoac temp token khong hop le
        '429':
          description: Nhap sai qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/register-with-otp:
    post:
      tags: [Xac thuc]
      summary: Dang ky sau khi xac minh OTP
      description: |
        Tao tai khoan sau khi OTP duoc xac minh.
        - Neu `role` la `OWNER`, tai khoan se duoc tao voi vai tro OWNER ngay lap tuc.
        - Neu `role` la `PLAYER` (mac dinh), user la PLAYER binh thuong va co the nang cap OWNER sau.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, password, full_name]
              properties:
                temp_token:     { type: string, description: 'Tu /verify-otp' }
                password:       { type: string, minLength: 6, example: 'password123' }
                full_name:      { type: string, example: 'Nguyen Van A' }
                district_code:  { type: string, example: 'CG', nullable: true }
                role:           { type: string, enum: [PLAYER, OWNER], default: PLAYER, description: 'Mac dinh PLAYER. Chi PLAYER co the dang ky OWNER va phai duyet' }
      responses:
        '201':
          description: Tao tai khoan thanh cong, nhan JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: Thieu truong, mat khau ngan, hoac temp token het han, hoac role khong hop le

  /api/auth/forgot-password:
    post:
      tags: [Xac thuc]
      summary: Yeu cau OTP de dat lai mat khau
      description: Gui OTP ve email. Con lai 15 phut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: 'user@example.com' }
      responses:
        '200':
          description: OTP gui thanh cong (khong tim thay email cung tra ve message nay de bao mat)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'OTP sent to email if account exists' }
                  email:   { type: string, example: '*@example.com', description: 'Email da an dau co diem' }
        '400':
          description: Email sai dinh dang (`INVALID_EMAIL`)
        '429':
          description: Yeu cau qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/verify-reset-otp:
    post:
      tags: [Xac thuc]
      summary: Xac minh OTP de dat lai mat khau
      description: Neu dung, tra ve temp_token (hieu luc 10 phut) dung de reset-password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email, example: 'user@example.com' }
                otp:   { type: string, example: '123456', maxLength: 6 }
      responses:
        '200':
          description: OTP dung, nhan temp_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp_token: { type: string, description: 'Dung de /reset-password' }
        '400':
          description: OTP khong dung, het han, hoac temp token khong hop le
        '429':
          description: Nhap sai qua nhieu, da khoa (`OTP_RATE_LIMITED`)

  /api/auth/reset-password:
    post:
      tags: [Xac thuc]
      summary: Dat lai mat khau sau khi xac minh OTP
      description: Dat lai mat khau sau khi OTP duoc xac minh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temp_token, password]
              properties:
                temp_token: { type: string, description: 'Tu /verify-reset-otp' }
                password:   { type: string, minLength: 6, example: 'newpassword123' }
      responses:
        '200':
          description: Dat lai mat khau thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: 'Password reset successfully' }
        '400':
          description: Mat khau qua ngan hoac temp token khong hop le / het han (`OTP_EXPIRED`)

  /api/venues:
    get:
      tags: [Cum san]
      summary: Tim cum san da duoc duyet
      parameters:
        - name: district
          in: query
          description: Ma quan/huyen, vi du `CG`
          schema: { type: string }
        - name: q
          in: query
          description: Tu khoa tim trong ten hoac dia chi
          schema: { type: string }
      responses:
        '200':
          description: Danh sach cum san, sap xep theo diem danh gia giam dan
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VenueSummary' }

  /api/venues/flash-sales:
    get:
      tags: [Cum san]
      summary: Cac cum san dang bat Flash Sale (Keo gap gia hoi)
      description: >
        Tra ve cum san APPROVED co khuyen mai FLASH_SALE dang hieu luc, kem san con, bang gia
        va cac slot da kin (HELD/CONFIRMED/LOCKED) hom nay va ngay mai. Frontend tu dung luoi slot
        90 phut va ap giam gia nhu trang chi tiet san.
      responses:
        '200':
          description: Danh sach cum san co Flash Sale
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        address: { type: string }
                        district_code: { type: string }
                        district_name: { type: string }
                        open_time: { type: string, example: '06:00:00' }
                        close_time: { type: string, example: '23:59:00' }
                        deposit_rate: { type: number }
                        flash_sale:
                          type: object
                          properties:
                            id: { type: integer }
                            discount_percent: { type: integer }
                            trigger_hours_before: { type: integer }
                            floor_price: { type: number, nullable: true }
                            applies_field_type: { type: string, enum: [F5, F7, F11], nullable: true }
                            time_spans:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  from_minute: { type: integer }
                                  to_minute: { type: integer }
                        fields:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                              type: { type: string, enum: [F5, F7, F11] }
                              is_active: { type: boolean }
                        price_rules:
                          type: array
                          items: { type: object }
                        schedule:
                          type: array
                          items:
                            type: object
                            properties:
                              field_id: { type: integer }
                              play_date: { type: string, format: date }
                              start_at: { type: string, format: date-time }
                              end_at: { type: string, format: date-time }
                              slot_status: { type: string, enum: [HELD, CONFIRMED, LOCKED] }

  /api/venues/{id}:
    get:
      tags: [Cum san]
      summary: Chi tiet cum san kem san con, tien ich va bang gia
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Chi tiet cum san
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/venues/{id}/revenue:
    get:
      tags: [Cum san]
      summary: Doanh thu theo ngay (60 ngay gan nhat)
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: Doanh thu theo ngay
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        venue_id:      { type: integer }
                        play_date:     { type: string, format: date }
                        booking_count: { type: integer }
                        revenue:       { type: integer }

  /api/fields/{id}/schedule:
    get:
      tags: [San con]
      summary: So do lich cua mot san con trong ngay
      description: Nguon du lieu cho man hinh WF-03 (so do lich real-time).
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - name: date
          in: query
          description: Ngay can xem, mac dinh hom nay
          schema: { type: string, format: date, example: '2026-09-20' }
      responses:
        '200':
          description: Danh sach khung gio trong ngay
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_id:  { type: integer }
                  play_date: { type: string, format: date }
                  count:     { type: integer }
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }

  /api/fields/{id}/availability:
    get:
      tags: [San con]
      summary: Kiem tra mot khung gio con trong khong
      parameters:
        - $ref: '#/components/parameters/FieldId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: start
          in: query
          required: true
          schema: { type: string, example: '19:30' }
        - name: end
          in: query
          required: true
          schema: { type: string, example: '21:00' }
      responses:
        '200':
          description: Ket qua kiem tra
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_id:  { type: integer }
                  date:      { type: string, format: date }
                  start:     { type: string }
                  end:       { type: string }
                  available: { type: boolean }
        '400':
          description: Thieu tham so bat buoc (`MISSING_FIELD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/pricing/{venueId}:
    get:
      tags: [Bang gia]
      summary: Danh sach tat ca bang gia theo khung gio (SCRUM-121)
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Danh sach bang gia
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PricingRule' }

    post:
      tags: [Bang gia]
      summary: Tao bang gia moi (SCRUM-121)
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePricingRuleRequest' }
      responses:
        '201':
          description: Tao bang gia thanh cong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400':
          description: Thieu truong bat buoc hoac khung gio khong hop le
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'Khung gio bi chong lap (SCRUM-122, code: `PRICE_SLOT_OVERLAP`)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/pricing/{venueId}/{id}:
    get:
      tags: [Bang gia]
      summary: Chi tiet mot bang gia
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Chi tiet bang gia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Bang gia]
      summary: Cap nhat bang gia
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePricingRuleRequest' }
      responses:
        '200':
          description: Cap nhat thanh cong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400':
          description: Du lieu khong hop le
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Khung gio bi chong lap (SCRUM-122)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [Bang gia]
      summary: Xoa bang gia
      security:
        - BearerAuth: []
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: integer }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Xoa thanh cong
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookings:
    get:
      tags: [Dat san]
      summary: Lich cua toi
      description: |
        Gom don minh dat va cac tran minh duoc chap nhan tham gia qua cap keo / ghep chan le
        (`match_participant`). Voi tran tham gia, `is_participant = true` va `host_name` la nguoi dat san.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Toi da 100 don, moi don kem `slots`, `services`, `is_participant`, `host_name`
    post:
      tags: [Dat san]
      summary: Tao don dat san va giu khung gio
      description: |
        Don duoc tao o trang thai `HELD` kem `hold_expires_at`.
        Rang buoc `EXCLUDE` o tang CSDL dam bao hai nguoi dat cung khung gio
        thi nguoi sau nhan loi `SLOT_TAKEN` - chong dat trung ngay ca khi chay song song.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Tao don thanh cong, khung gio da duoc giu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Thieu truong bat buoc hoac vi pham rang buoc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                MISSING_FIELD:
                  value:
                    error:
                      code: MISSING_FIELD
                      message: 'Thieu truong bat buoc: user_id'
                      details: { missing: [user_id] }
                      requestId: 3f7c9b12-1f0a-4c2e-9f11-2b7d4e8a91c3
                      timestamp: '2026-09-14T12:30:00.000Z'
        '404':
          description: San khong ton tai (`FIELD_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Xung dot nghiep vu:
            `SLOT_TAKEN` khung gio da co nguoi dat,
            `NO_PRICE_RULE` chua co bang gia,
            `VENUE_NOT_APPROVED` cum san chua duoc duyet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                SLOT_TAKEN:
                  value:
                    error:
                      code: SLOT_TAKEN
                      message: Khung gio nay da co nguoi dat
                      requestId: 8a2f1c04-77bd-4f3a-8c19-51e0b7f2a6dd
                      timestamp: '2026-09-14T12:30:00.000Z'

  /api/bookings/{code}:
    get:
      tags: [Dat san]
      summary: Tra cuu don theo ma
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: BK260914A7K2M }
      responses:
        '200':
          description: Chi tiet don kem khung gio va giao dich thanh toan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/bookings/{code}/cancel:
    post:
      tags: [Dat san]
      summary: Huy don va tra lai khung gio
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: Ban dot xuat }
      responses:
        '200':
          description: Da huy
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:            { type: string }
                  status:          { type: string, example: CANCELLED_BY_USER }
                  released_slots:  { type: integer }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Don o trang thai khong cho huy (`INVALID_STATUS`) hoac da qua gio bat dau tran (`BOOKING_ALREADY_STARTED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/bookings/{code}/rate:
    post:
      tags: [Dat san]
      summary: Danh gia tran da da xong (moi don 1 lan, chi nguoi dat)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pitch_rating, service_rating]
              properties:
                pitch_rating:   { type: integer, minimum: 1, maximum: 5, example: 5 }
                service_rating: { type: integer, minimum: 1, maximum: 5, example: 4 }
                comment:        { type: string, maxLength: 1000, example: Co dep, den sang }
      responses:
        '201':
          description: Da luu danh gia, diem trung binh cua cum san duoc cap nhat
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:           { type: string }
                  id:             { type: integer }
                  pitch_rating:   { type: integer }
                  service_rating: { type: integer }
                  comment:        { type: string, nullable: true }
                  created_at:     { type: string, format: date-time }
        '400':
          description: Diem khong hop le (`INVALID_RATING`) hoac tran chua da xong / don khong hop le (`CANNOT_RATE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Khong phai nguoi dat don (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Da danh gia don nay roi (`ALREADY_RATED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/bookings/maintenance/release-expired:
    post:
      tags: [Dat san]
      summary: Don cac don giu cho da qua han
      description: Goi ham `fn_release_expired_holds()` trong CSDL. Dung cho cron hoac thao tac thu cong.
      responses:
        '200':
          description: So don da duoc giai phong
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: integer, example: 3 }

  /api/freelance/recruits:
    get:
      tags: [Ghep chan le]
      summary: Tab "Doi bong tim nguoi" - bai tuyen chan le dang mo (bai bi bung keo sat gio xep dau)
      security:
        - BearerAuth: []
      parameters:
        - { name: district, in: query, schema: { type: string }, description: Ma quan/huyen }
        - { name: period, in: query, schema: { type: string, enum: [morning, afternoon, evening] }, description: 'Sang (<12h) / Chieu (12-18h) / Toi (>=18h) theo gio bat dau' }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/SkillLevel' } }
        - { name: cost, in: query, schema: { type: string, enum: [FREE, FIXED, VOLUNTARY] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Danh sach co phan trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  count: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecruitPost' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ghep chan le]
      summary: Doi truong dang bai tim chan le cho tran da dat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code, slots_needed, cost_kind]
              properties:
                booking_code: { type: string, example: BK261013ABCDE }
                slots_needed: { type: integer, minimum: 1, maximum: 10, example: 2 }
                positions:
                  type: array
                  items: { $ref: '#/components/schemas/Position' }
                  example: [DF, GK]
                required_level: { $ref: '#/components/schemas/SkillLevel' }
                cost_kind: { type: string, enum: [FREE, FIXED, VOLUNTARY] }
                cost_amount: { type: number, description: Bat buoc khi cost_kind = FIXED, example: 30000 }
                content: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Da dang bai
        '400':
          description: Tuyen qua 10 nguoi (`RECRUIT_LIMIT_EXCEEDED`) hoac du lieu sai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tran da co bai tuyen dang mo (`RECRUIT_POST_EXISTS`), don khong con hieu luc (`INVALID_STATUS`) hoac da qua gio (`BOOKING_ALREADY_STARTED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/freelance/recruits/{id}/apply:
    post:
      tags: [Ghep chan le]
      summary: Nguoi choi le xin tham gia; doi truong nhan thong bao
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, maxLength: 300, example: 'Minh da vi tri hau ve, toi nay tham gia duoc' }
                confirm_level: { type: boolean, description: Gui lai voi true sau khi nguoi dung dong y canh bao lech trinh do }
      responses:
        '201':
          description: Da gui yeu cau (PENDING)
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `RECRUIT_FULL` (doi da tuyen du nguoi), `LEVEL_MISMATCH` (trinh do thap hon yeu cau, chua xac nhan;
            details: my_level, required_level), `REQUEST_ALREADY_EXISTS`, `ALREADY_IN_MATCH`, `POST_NOT_OPEN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/freelance/players:
    get:
      tags: [Ghep chan le]
      summary: Tab "Nguoi choi tim doi" - tin tim doi dang mo
      security:
        - BearerAuth: []
      parameters:
        - { name: district, in: query, schema: { type: string }, description: Khop bat ky khu vuc nao nguoi choi chon }
        - { name: period, in: query, schema: { type: string, enum: [morning, afternoon, evening] } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/SkillLevel' } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: Danh sach co phan trang (page, limit, total, count, data)
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Ghep chan le]
      summary: Nguoi choi le dang tin tim doi
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [play_date, start, end, district_codes]
              properties:
                play_date: { type: string, format: date }
                start: { type: string, example: '19:00' }
                end: { type: string, example: '20:30' }
                district_codes: { type: array, maxItems: 5, items: { type: string }, example: [CG, NTL] }
                positions: { type: array, items: { $ref: '#/components/schemas/Position' } }
                level: { $ref: '#/components/schemas/SkillLevel' }
                content: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Da dang tin
        '400':
          description: Khung gio sai hoac da qua (`INVALID_TIME_RANGE`), khu vuc sai (`INVALID_FIELD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Da co tin tim doi de gio (`PLAYER_POST_OVERLAP`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/freelance/players/{id}/invite:
    post:
      tags: [Ghep chan le]
      summary: Doi truong moi nguoi choi le vao tran; loi moi tu het han sau 30 phut
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_code]
              properties:
                booking_code: { type: string }
