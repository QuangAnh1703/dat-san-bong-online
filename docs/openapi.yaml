    post:
      tags: [Ghep chan le]
      summary: Chu bai dong bai; yeu cau dang cho bi tu choi
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Da dong
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Bai khong con mo (`POST_NOT_OPEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/freelance/requests/{id}:
    put:
      tags: [Ghep chan le]
      summary: Chu bai phan hoi - doi truong duyet nguoi xin (APPLY), nguoi choi nhan/tu choi loi moi (INVITE)
      description: >-
        Chap nhan: them nguoi choi vao match_participant, tru so cho can tuyen; du nguoi thi bai chuyen MATCHED
        va cac yeu cau con cho bi tu choi. Ca hai phia deu nhan thong bao.
