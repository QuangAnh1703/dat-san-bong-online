# Render Blueprint: Dashboard -> New -> Blueprint -> chon repo nay.
# Tao 3 thu: CSDL Postgres, Redis (Key Value) va API; URL CSDL/Redis tu noi vao API.
databases:
  # Postgres free cua Render het han sau 30 ngay -> nang cap hoac tao lai truoc han
  - name: sanbong-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: sanbong
    user: sanbong

services:
  - type: keyvalue
    name: sanbong-redis
    plan: free
    region: singapore
    # Chi cho cac service trong cung tai khoan Render ket noi
    ipAllowList: []

  - type: web
    name: sanbong-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    # Goi free khong co pre-deploy command -> chay migration ngay truoc khi start
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: NODE_ENV
        value: production
      - key: HOLD_MINUTES
        value: "15"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: sanbong-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sanbong-redis
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      # Email (khong bat buoc). Goi free chan SMTP -> Gmail chi chay khi nang cap goi tra phi,
      # hoac dung Brevo HTTP API (BREVO_API_KEY + EMAIL_FROM)
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SEPAY_BANK_CODE
        sync: false
      - key: SEPAY_BANK_ACCOUNT
        sync: false
      - key: SEPAY_BANK_HOLDER
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
